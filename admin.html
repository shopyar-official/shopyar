<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت سفارشات - شاپ یار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- صفحه لاگین (در صورت عدم ورود) -->
    <div id="loginOverlay" class="fixed inset-0 bg-slate-900 bg-opacity-70 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-xl">
            <h2 class="text-base font-bold text-slate-800 mb-2 text-center">🔐 ورود به پنل مدیریت شاپ‌یار</h2>
            <p class="text-xs text-slate-500 mb-4 text-center">لطفاً رمز عبور خود را وارد کنید</p>
            <form onsubmit="handleLogin(event)" class="space-y-3">
                <input type="password" id="loginPass" placeholder="رمز عبور (پیش‌فرض: 1234)" required class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500">
                <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-xl text-xs transition">ورود به پنل</button>
            </form>
            <div id="loginError" class="mt-2 text-center text-xs text-rose-500"></div>
        </div>
    </div>

    <!-- بدنه اصلی پنل مدیریت -->
    <div id="adminPanel" class="hidden">
        <!-- هدر پنل -->
        <header class="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-2">
                <span class="text-xl">👑</span>
                <h1 class="text-sm font-bold text-slate-800">مدیریت سفارشات شاپ‌یار</h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="loadOrders()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-1.5 rounded-xl transition">🔄 بروزرسانی</button>
                <button onclick="logout()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs px-3 py-1.5 rounded-xl transition">خروج</button>
            </div>
        </header>

        <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
            
            <!-- کارت‌های آماری و فیلتر -->
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                <div onclick="filterOrders('همه')" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-orange-500 transition">
                    <div class="text-xs text-slate-500">همه سفارش‌ها</div>
                    <div id="count-all" class="text-lg font-bold text-slate-800 mt-1">۰</div>
                </div>
                <div onclick="filterOrders('در حال بررسی')" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-orange-500 transition">
                    <div class="text-xs text-amber-600">در حال بررسی</div>
                    <div id="count-review" class="text-lg font-bold text-amber-600 mt-1">۰</div>
                </div>
                <div onclick="filterOrders('در حال آماده‌سازی')" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-orange-500 transition">
                    <div class="text-xs text-blue-600">در حال آماده‌سازی</div>
                    <div id="count-prep" class="text-lg font-bold text-blue-600 mt-1">۰</div>
                </div>
                <div onclick="filterOrders('ارسال شده')" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-orange-500 transition">
                    <div class="text-xs text-purple-600">ارسال شده</div>
                    <div id="count-sent" class="text-lg font-bold text-purple-600 mt-1">۰</div>
                </div>
                <div onclick="filterOrders('تکمیل شده')" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-orange-500 transition col-span-2 md:col-span-1">
                    <div class="text-xs text-emerald-600">تکمیل شده</div>
                    <div id="count-done" class="text-lg font-bold text-emerald-600 mt-1">۰</div>
                </div>
            </div>

            <!-- بخش جستجو -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="جستجو بر اساس نام مشتری، شماره موبایل یا کد سفارش..." class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium">
            </div>

            <!-- لیست سفارشات -->
            <div id="ordersContainer" class="space-y-3">
                <div class="text-center py-10 text-slate-400 text-xs">در حال بارگذاری سفارش‌ها...</div>
            </div>

        </main>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec';
        let allOrders = [];
        let currentFilter = 'همه';

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('shopyar_admin_logged') === 'true') {
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadOrders();
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('loginPass').value;
            if (pass === '1234') {
                localStorage.setItem('shopyar_admin_logged', 'true');
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadOrders();
            } else {
                document.getElementById('loginError').textContent = 'رمز عبور اشتباه است!';
            }
        }

        function logout() {
            localStorage.removeItem('shopyar_admin_logged');
            location.reload();
        }

        function loadOrders() {
            fetch(`${SCRIPT_URL}?action=get_orders`)
                .then(res => res.json())
                .then(data => {
                    if (Array.isArray(data)) {
                        // معکوس کردن لیست برای اینکه جدیدترین‌ها در صدر (اول) نمایش داده شوند
                        allOrders = data.reverse();
                        filterOrders(currentFilter);
                        updateStats(allOrders);
                    } else {
                        document.getElementById('ordersContainer').innerHTML = '<div class="text-center py-10 text-rose-500 text-xs">خطا در دریافت اطلاعات.</div>';
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('ordersContainer').innerHTML = '<div class="text-center py-10 text-rose-500 text-xs">خطا در اتصال به سرور.</div>';
                });
        }

        function updateStats(orders) {
            document.getElementById('count-all').textContent = orders.length;
            document.getElementById('count-review').textContent = orders.filter(o => !o.status || o.status === 'در حال بررسی').length;
            document.getElementById('count-prep').textContent = orders.filter(o => o.status === 'در حال آماده‌سازی').length;
            document.getElementById('count-sent').textContent = orders.filter(o => o.status === 'ارسال شده').length;
            document.getElementById('count-done').textContent = orders.filter(o => o.status === 'تکمیل شده').length;
        }

        function filterOrders(status) {
            currentFilter = status;
            let filtered = allOrders;
            if (status !== 'همه') {
                filtered = allOrders.filter(o => {
                    if (status === 'در حال بررسی') return !o.status || o.status === status;
                    return o.status === status;
                });
            }
            renderOrders(filtered);
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            let filtered = allOrders;
            
            if (currentFilter !== 'همه') {
                filtered = allOrders.filter(o => {
                    if (currentFilter === 'در حال بررسی') return !o.status || o.status === currentFilter;
                    return o.status === currentFilter;
                });
            }

            if (query !== '') {
                filtered = filtered.filter(o => 
                    (o.name && o.name.toLowerCase().includes(query)) ||
                    (o.phone && o.phone.toLowerCase().includes(query)) ||
                    (o.orderId && o.orderId.toLowerCase().includes(query))
                );
            }
            renderOrders(filtered);
        }

        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');
            if (orders.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-slate-400 text-xs bg-white rounded-2xl border border-slate-200">سفارشی یافت نشد.</div>';
                return;
            }

            container.innerHTML = orders.map(o => {
                const status = o.status || 'در حال بررسی';
                let statusColor = 'bg-amber-50 text-amber-700 border-amber-200';
                if (status === 'در حال آماده‌سازی') statusColor = 'bg-blue-50 text-blue-700 border-blue-200';
                if (status === 'ارسال شده') statusColor = 'bg-purple-50 text-purple-700 border-purple-200';
                if (status === 'تکمیل شده') statusColor = 'bg-emerald-50 text-emerald-700 border-emerald-200';

                return `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="space-y-1 text-xs">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-slate-800 text-sm">${o.name}</span>
                                <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md font-mono">${o.orderId || '---'}</span>
                                <span class="px-2.5 py-0.5 rounded-full border font-medium ${statusColor}">${status}</span>
                            </div>
                            <div class="text-slate-600"><strong>تلفن:</strong> <a href="tel:${o.phone}" class="text-orange-600 hover:underline">${o.phone}</a></div>
                            <div class="text-slate-600"><strong>شهر و آدرس:</strong> ${o.city} - ${o.address}</div>
                            <div class="text-slate-700 font-medium bg-slate-50 p-2 rounded-xl mt-1">🛍️ ${o.product}</div>
                            <div class="text-slate-400 text-[10px]">تاریخ ثبت: ${o.date}</div>
                        </div>

                        <div class="flex flex-wrap md:flex-col gap-2 w-full md:w-auto">
                            <!-- دکمه‌های تماس و واتس‌اپ -->
                            <div class="flex gap-2 w-full">
                                <a href="tel:${o.phone}" class="flex-1 text-center bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-medium py-1.5 px-3 rounded-xl text-xs transition">📞 تماس</a>
                                <a href="https://wa.me/98${o.phone.startsWith('0') ? o.phone.substring(1) : o.phone}?text=سلام%20${encodeURIComponent(o.name)}%20عزیز،%20در%20خصوص%20سفارش%20شما%20در%20شاپ‌یار..." target="_blank" class="flex-1 text-center bg-green-50 hover:bg-green-100 text-green-700 font-medium py-1.5 px-3 rounded-xl text-xs transition">💬 واتس‌اپ</a>
                            </div>

                            <!-- تغییر وضعیت سفارش -->
                            <select onchange="updateStatus('${o.orderId}', this.value)" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium text-slate-700">
                                <option value="" disabled selected>تغییر وضعیت...</option>
                                <option value="در حال بررسی">در حال بررسی</option>
                                <option value="در حال آماده‌سازی">در حال آماده‌سازی</option>
                                <option value="ارسال شده">ارسال شده</option>
                                <option value="تکمیل شده">تکمیل شده</option>
                            </select>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStatus(orderId, newStatus) {
            if (!orderId) return;
            
            const formData = new URLSearchParams({
                action: 'update_status',
                orderId: orderId,
                status: newStatus
            });

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    loadOrders();
                } else {
                    alert('خطا در بروزرسانی وضعیت');
                }
            })
            .catch(err => {
                console.error(err);
                alert('خطا در اتصال به سرور');
            });
        }
    </script>
</body>
</html>
