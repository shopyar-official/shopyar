<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاپ‌یار | پنل مدیریت سفارش‌ها</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- صفحه ورود (Login Modal) -->
    <div id="login-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm text-center">
            <div class="w-16 h-16 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">🛍️</div>
            <h2 class="text-xl font-bold text-gray-800 mb-2">ورود به پنل مدیریت شاپ‌یار</h2>
            <p class="text-xs text-gray-500 mb-4">لطفاً رمز عبور مدیریت را وارد کنید</p>
            <input type="password" id="admin-pass" placeholder="رمز عبور (پیش‌فرض: 1234)" class="w-full px-4 py-3 border border-gray-300 rounded-xl mb-4 text-center text-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
            <button onclick="checkLogin()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-orange-500/30">ورود به پنل</button>
            <p id="login-error" class="text-red-500 text-xs mt-3 hidden">رمز عبور اشتباه است!</p>
        </div>
    </div>

    <!-- بدنه اصلی پنل -->
    <div id="admin-content" class="hidden">
        <!-- هدر -->
        <header class="bg-white shadow-sm border-b sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-orange-500 text-white rounded-xl flex items-center justify-center font-bold text-lg">ش</div>
                    <div>
                        <h1 class="font-bold text-gray-800">پنل مدیریت شاپ‌یار</h1>
                        <p class="text-xs text-gray-500">مدیریت و مشاهده لحظه‌ای سفارش‌ها</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="fetchOrders()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-xl text-xs font-medium transition flex items-center gap-1">🔄 بروزرسانی</button>
                    <button onclick="logout()" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-2 rounded-xl text-xs font-medium transition">خروج</button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
            <!-- کادر جستجو -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border">
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="جستجو بر اساس نام مشتری، شماره موبایل یا محصول..." class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
            </div>

            <!-- کارت‌های وضعیت -->
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                <button onclick="filterOrders('همه')" class="status-card bg-white p-4 rounded-2xl shadow-sm border text-right transition border-orange-500 ring-2 ring-orange-500/20" data-status="همه">
                    <div class="text-gray-500 text-xs mb-1">همه سفارش‌ها</div>
                    <div id="count-all" class="text-xl font-bold text-gray-800">0</div>
                </button>
                <button onclick="filterOrders('در انتظار بررسی')" class="status-card bg-white p-4 rounded-2xl shadow-sm border text-right transition hover:border-orange-300" data-status="در انتظار بررسی">
                    <div class="text-amber-600 text-xs mb-1">در انتظار بررسی</div>
                    <div id="count-review" class="text-xl font-bold text-amber-600">0</div>
                </button>
                <button onclick="filterOrders('در حال آماده‌سازی')" class="status-card bg-white p-4 rounded-2xl shadow-sm border text-right transition hover:border-orange-300" data-status="در حال آماده‌سازی">
                    <div class="text-blue-600 text-xs mb-1">در حال آماده‌سازی</div>
                    <div id="count-prep" class="text-xl font-bold text-blue-600">0</div>
                </button>
                <button onclick="filterOrders('ارسال شده')" class="status-card bg-white p-4 rounded-2xl shadow-sm border text-right transition hover:border-orange-300" data-status="ارسال شده">
                    <div class="text-purple-600 text-xs mb-1">ارسال شده</div>
                    <div id="count-sent" class="text-xl font-bold text-purple-600">0</div>
                </button>
                <button onclick="filterOrders('تکمیل شده')" class="status-card col-span-2 md:col-span-1 bg-white p-4 rounded-2xl shadow-sm border text-right transition hover:border-orange-300" data-status="تکمیل شده">
                    <div class="text-green-600 text-xs mb-1">تکمیل شده</div>
                    <div id="count-done" class="text-xl font-bold text-green-600">0</div>
                </button>
            </div>

            <!-- لیست سفارش‌ها -->
            <div>
                <div id="loading" class="text-center py-12 text-gray-500 text-sm">در حال دریافت سفارش‌ها از سرور...</div>
                <div id="error-msg" class="hidden bg-red-50 text-red-600 p-4 rounded-2xl text-center text-sm border border-red-200 mb-4">خطا در ارتباط با سرور یا دریافت اطلاعات. لطفا دوباره تلاش کنید.</div>
                <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                <div id="no-orders" class="hidden text-center py-12 text-gray-400 text-sm bg-white rounded-2xl border shadow-sm">هنوز سفارشی ثبت نشده است!</div>
            </div>
        </main>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec';
        let allOrders = [];
        let currentFilter = 'همه';

        window.onload = function() {
            if (localStorage.getItem('shopyar_admin_logged') === 'true') {
                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('admin-content').classList.remove('hidden');
                fetchOrders();
            }
        };

        function checkLogin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === '1234') {
                localStorage.setItem('shopyar_admin_logged', 'true');
                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('admin-content').classList.remove('hidden');
                fetchOrders();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('shopyar_admin_logged');
            location.reload();
        }

        function fetchOrders() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error-msg').classList.add('hidden');
            document.getElementById('ordersContainer').innerHTML = '';

            fetch(`${SCRIPT_URL}?action=get_orders`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    let ordersArray = [];
                    if (Array.isArray(data)) {
                        ordersArray = data;
                    } else if (data && data.orders && Array.isArray(data.orders)) {
                        ordersArray = data.orders;
                    }

                    if (ordersArray.length > 0) {
                        // معکوس کردن آرایه برای نمایش سفارش‌های جدید در صدر لیست
                        allOrders = ordersArray.reverse();
                        updateStats(allOrders);
                        filterOrders(currentFilter);
                    } else {
                        document.getElementById('no-orders').classList.remove('hidden');
                    }
                })
                .catch(err => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error-msg').classList.remove('hidden');
                });
        }

        function updateStats(orders) {
            document.getElementById('count-all').innerText = orders.length;
            document.getElementById('count-review').innerText = orders.filter(o => o.status === 'در انتظار بررسی' || o.status === 'در حال بررسی' || o.status === '-').length;
            document.getElementById('count-prep').innerText = orders.filter(o => o.status === 'در حال آماده‌سازی').length;
            document.getElementById('count-sent').innerText = orders.filter(o => o.status === 'ارسال شده').length;
            document.getElementById('count-done').innerText = orders.filter(o => o.status === 'تکمیل شده').length;
        }

        function filterOrders(status) {
            currentFilter = status;
            
            document.querySelectorAll('.status-card').forEach(btn => {
                if (btn.dataset.status === status) {
                    btn.classList.add('border-orange-500', 'ring-2', 'ring-orange-500/20');
                } else {
                    btn.classList.remove('border-orange-500', 'ring-2', 'ring-orange-500/20');
                }
            });

            let filtered = allOrders;
            if (status !== 'همه') {
                if (status === 'در انتظار بررسی') {
                    filtered = allOrders.filter(o => o.status === 'در انتظار بررسی' || o.status === 'در حال بررسی' || o.status === '-');
                } else {
                    filtered = allOrders.filter(o => o.status === status);
                }
            }

            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (searchTerm) {
                filtered = filtered.filter(o => 
                    (o.name && o.name.toLowerCase().includes(searchTerm)) ||
                    (o.phone && o.phone.toLowerCase().includes(searchTerm)) ||
                    (o.product && o.product.toLowerCase().includes(searchTerm))
                );
            }

            renderOrders(filtered);
        }

        function handleSearch() {
            filterOrders(currentFilter);
        }

        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = '';

            if (orders.length === 0) {
                document.getElementById('no-orders').classList.remove('hidden');
                return;
            } else {
                document.getElementById('no-orders').classList.add('hidden');
            }

            orders.forEach((order, index) => {
                let badgeColor = 'bg-gray-100 text-gray-700';
                let currentStat = order.status || 'در انتظار بررسی';
                if (currentStat === 'در انتظار بررسی' || currentStat === 'در حال بررسی' || currentStat === '-') badgeColor = 'bg-amber-50 text-amber-600 border border-amber-200';
                else if (currentStat === 'در حال آماده‌سازی') badgeColor = 'bg-blue-50 text-blue-600 border border-blue-200';
                else if (currentStat === 'ارسال شده') badgeColor = 'bg-purple-50 text-purple-600 border border-purple-200';
                else if (currentStat === 'تکمیل شده') badgeColor = 'bg-green-50 text-green-600 border border-green-200';

                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-5 shadow-sm border border-gray-200 flex flex-col justify-between space-y-4 hover:shadow-md transition';
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <span class="text-xs text-gray-400">مشتری:</span>
                                <h3 class="font-bold text-gray-800 text-base">${order.name || 'بدون نام'}</h3>
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-medium ${badgeColor}">${currentStat}</span>
                        </div>
                        <div class="space-y-1.5 text-xs text-gray-600 bg-gray-50 p-3 rounded-xl">
                            <div class="flex justify-between"><span>تلفن:</span> <strong class="text-gray-800">${order.phone || '-'}</strong></div>
                            <div class="flex justify-between"><span>شهر:</span> <strong class="text-gray-800">${order.city || '-'}</strong></div>
                            <div class="flex justify-between"><span>آدرس:</span> <strong class="text-gray-800 truncate max-w-[200px]">${order.address || '-'}</strong></div>
                            <div class="flex justify-between"><span>محصول:</span> <strong class="text-orange-600">${order.product || '-'} (${order.quantity || 1} عدد)</strong></div>
                            <div class="flex justify-between"><span>تاریخ:</span> <span class="text-gray-400">${order.date || '-'}</span></div>
                        </div>
                    </div>
                    <div class="pt-3 border-t border-gray-100 flex items-center justify-between gap-2">
                        <div class="flex gap-1.5">
                            <a href="tel:${order.phone}" class="w-9 h-9 bg-green-50 text-green-600 hover:bg-green-100 rounded-xl flex items-center justify-center transition" title="تماس مستقیم">📞</a>
                            <a href="https://wa.me/98${order.phone ? order.phone.replace(/^0/, '') : ''}" target="_blank" class="w-9 h-9 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 rounded-xl flex items-center justify-center transition" title="واتس‌اپ">💬</a>
                        </div>
                        <select onchange="updateOrderStatus('${order.orderId || index}', this.value)" class="text-xs border border-gray-300 rounded-xl px-2 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-orange-500">
                            <option value="" disabled selected>تغییر وضعیت...</option>
                            <option value="در انتظار بررسی">در انتظار بررسی</option>
                            <option value="در حال آماده‌سازی">در حال آماده‌سازی</option>
                            <option value="ارسال شده">ارسال شده</option>
                            <option value="تکمیل شده">تکمیل شده</option>
                        </select>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateOrderStatus(orderId, newStatus) {
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'update_status', orderId: orderId, status: newStatus })
            }).then(() => {
                alert('وضعیت سفارش با موفقیت بروز شد!');
                fetchOrders();
            }).catch(err => {
                alert('خطا در بروزرسانی وضعیت');
            });
        }
    </script>
</body>
</html>
