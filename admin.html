<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت سفارشات - شاپ‌یار</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>
    body { font-family: Vazirmatn, sans-serif; }
    .loading { opacity: .6; pointer-events: none; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

<!-- بخش ورود به پنل -->
<div id="loginOverlay" class="fixed inset-0 bg-slate-900/80 flex items-center justify-center z-50 p-4">
  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8">
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-amber-500 text-white rounded-2xl mx-auto flex items-center justify-center text-3xl font-bold mb-3">ش</div>
      <h2 class="text-xl font-bold text-slate-800">ورود به پنل مدیریت شاپ‌یار</h2>
      <p class="text-xs text-slate-500 mt-1">نام کاربری و رمز عبور مدیریت را وارد کنید</p>
    </div>
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">نام کاربری</label>
        <input id="loginUser" type="text" required class="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">رمز عبور</label>
        <input id="loginPass" type="password" required class="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
      </div>
      <button id="loginBtn" type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white rounded-xl py-3 text-sm font-bold shadow-lg shadow-amber-500/20">ورود به پنل</button>
      <div id="loginError" class="text-xs text-rose-600 text-center min-h-[20px]"></div>
    </form>
  </div>
</div>

<!-- پنل اصلی (ابتدا مخفی) -->
<main id="adminMain" class="max-w-7xl mx-auto hidden">
  <header class="bg-white border border-slate-200 rounded-2xl p-5 mb-6 shadow-sm">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-amber-500 text-white flex items-center justify-center text-2xl font-bold">ش</div>
        <div>
          <h1 class="font-bold text-xl text-slate-800">پنل مدیریت سفارشات - شاپ‌یار</h1>
          <p class="text-xs text-slate-500 mt-1">مدیریت و پیگیری سفارش‌های ثبت‌شده</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button id="refreshBtn" type="button" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-sm font-medium">بروزرسانی لیست</button>
        <button onclick="logout()" type="button" class="bg-rose-50 hover:bg-rose-100 text-rose-700 px-4 py-2.5 rounded-xl text-sm font-medium">خروج</button>
      </div>
    </div>
  </header>

  <section class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-3 mb-6">
    <button data-filter="all" class="filter-btn bg-white border-2 border-amber-500 rounded-xl p-4 text-right">
      <span class="block text-xs text-slate-500">همه سفارش‌ها</span>
      <strong id="count-all" class="block text-2xl text-slate-800 mt-1">0</strong>
    </button>
    <button data-filter="pending-pay" class="filter-btn bg-white border border-slate-200 rounded-xl p-4 text-right">
      <span class="block text-xs text-yellow-600">در انتظار پرداخت</span>
      <strong id="count-pending-pay" class="block text-2xl text-yellow-600 mt-1">0</strong>
    </button>
    <button data-filter="pending" class="filter-btn bg-white border border-slate-200 rounded-xl p-4 text-right">
      <span class="block text-xs text-amber-600">منتظر تأیید</span>
      <strong id="count-pending" class="block text-2xl text-amber-600 mt-1">0</strong>
    </button>
    <button data-filter="processing" class="filter-btn bg-white border border-slate-200 rounded-xl p-4 text-right">
      <span class="block text-xs text-blue-600">در حال پردازش</span>
      <strong id="count-processing" class="block text-2xl text-blue-600 mt-1">0</strong>
    </button>
    <button data-filter="shipped" class="filter-btn bg-white border border-slate-200 rounded-xl p-4 text-right">
      <span class="block text-xs text-emerald-600">ارسال شده</span>
      <strong id="count-shipped" class="block text-2xl text-emerald-600 mt-1">0</strong>
    </button>
    <button data-filter="completed" class="filter-btn bg-white border border-slate-200 rounded-xl p-4 text-right">
      <span class="block text-xs text-indigo-600">تکمیل شده</span>
      <strong id="count-completed" class="block text-2xl text-indigo-600 mt-1">0</strong>
    </button>
    <button data-filter="rejected" class="filter-btn bg-white border border-slate-200 rounded-xl p-4 text-right">
      <span class="block text-xs text-rose-600">رد شده</span>
      <strong id="count-rejected" class="block text-2xl text-rose-600 mt-1">0</strong>
    </button>
  </section>

  <section id="orders-container" class="space-y-4">
    <div class="bg-white rounded-2xl p-10 text-center text-slate-500">در حال بارگذاری سفارشات...</div>
  </section>
</main>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec";
  let allOrders = [];
  let currentFilter = "all";
  const STATUS = { PENDING_PAY: "در انتظار پرداخت", PENDING: "منتظر تأیید", PROCESSING: "در حال پردازش", SHIPPED: "ارسال شده", COMPLETED: "تکمیل شده", REJECTED: "رد شده" };

  function escapeHtml(value) { return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
  function normalize(value) { return String(value ?? "").replace(/ي/g, "ی").replace(/ك/g, "ک").trim(); }
  function getOrderId(order) { return String(order.orderId ?? order.id ?? "").trim(); }
  function getRawStatus(order) { return String(order.status ?? "").trim(); }
  
  function statusKey(status) {
    const s = normalize(status);
    if (s.includes("پرداخت") && s.includes("انتظار")) return "pending-pay";
    if (s.includes("پردازش")) return "processing";
    if (s.includes("ارسال")) return "shipped";
    if (s.includes("تکمیل")) return "completed";
    if (s.includes("رد")) return "rejected";
    return "pending";
  }

  function getStatusClass(key) {
    if (key === "pending-pay") return "bg-yellow-100 text-yellow-700";
    if (key === "pending") return "bg-amber-100 text-amber-700";
    if (key === "processing") return "bg-blue-100 text-blue-700";
    if (key === "shipped") return "bg-emerald-100 text-emerald-700";
    if (key === "completed") return "bg-indigo-100 text-indigo-700";
    if (key === "rejected") return "bg-rose-100 text-rose-700";
    return "bg-slate-100 text-slate-600";
  }

  async function handleLogin(event) {
    event.preventDefault();
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value;
    const errEl = document.getElementById("loginError");
    const btn = document.getElementById("loginBtn");

    errEl.textContent = "در حال بررسی...";
    btn.disabled = true;

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "login", username: user, password: pass })
      });
      const data = await res.json();
      if (data.status === "success") {
        localStorage.setItem("shopyar_admin_token", data.token);
        document.getElementById("loginOverlay").classList.add("hidden");
        document.getElementById("adminMain").classList.remove("hidden");
        fetchOrders();
      } else {
        errEl.textContent = data.message || "نام کاربری یا رمز عبور اشتباه است.";
      }
    } catch (err) {
      errEl.textContent = "خطا در ارتباط با سرور.";
    } finally {
      btn.disabled = false;
    }
  }

  function logout() {
    localStorage.removeItem("shopyar_admin_token");
    location.reload();
  }

  async function fetchOrders() {
    const token = localStorage.getItem("shopyar_admin_token");
    if (!token) { logout(); return; }

    const container = document.getElementById("orders-container");
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "get_orders", token: token })
      });
      const data = await res.json();
      if (data.status === "success") {
        allOrders = data.orders || [];
        updateCounts();
        renderOrders();
      } else {
        alert(data.message || "نشست منقضی شده است.");
        logout();
      }
    } catch (err) {
      container.innerHTML = `<div class="bg-rose-50 text-rose-700 rounded-2xl p-6 text-center">خطا در دریافت سفارشات.</div>`;
    }
  }

  function updateCounts() {
    const counts = { all: allOrders.length, "pending-pay": 0, pending: 0, processing: 0, shipped: 0, completed: 0, rejected: 0 };
    allOrders.forEach(order => {
      const key = statusKey(getRawStatus(order));
      if (counts[key] !== undefined) counts[key]++;
    });
    document.getElementById("count-all").textContent = counts.all;
    document.getElementById("count-pending-pay").textContent = counts["pending-pay"];
    document.getElementById("count-pending").textContent = counts.pending;
    document.getElementById("count-processing").textContent = counts.processing;
    document.getElementById("count-shipped").textContent = counts.shipped;
    document.getElementById("count-completed").textContent = counts.completed;
    document.getElementById("count-rejected").textContent = counts.rejected;
  }

  function setFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll(".filter-btn").forEach(b => { b.classList.remove("border-2", "border-amber-500"); b.classList.add("border", "border-slate-200"); });
    const active = document.querySelector(`.filter-btn[data-filter="${filter}"]`);
    if (active) { active.classList.remove("border", "border-slate-200"); active.classList.add("border-2", "border-amber-500"); }
    renderOrders();
  }

  function renderOrders() {
    const container = document.getElementById("orders-container");
    let orders = allOrders;
    if (currentFilter !== "all") orders = allOrders.filter(o => statusKey(getRawStatus(o)) === currentFilter);
    if (orders.length === 0) { container.innerHTML = `<div class="bg-white rounded-2xl p-10 text-center text-slate-500">سفارشی در این وضعیت وجود ندارد.</div>`; return; }

    container.innerHTML = orders.map(order => {
      const orderId = getOrderId(order);
      const rawStatus = getRawStatus(order);
      const key = statusKey(rawStatus);
      const total = order.totalAmount ? Number(order.totalAmount).toLocaleString("fa-IR") + " تومان" : "---";
      return `
        <article class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-slate-100 pb-4 mb-4">
            <div class="flex items-center gap-2">
              <span class="bg-slate-100 text-slate-700 rounded-lg px-3 py-1 text-xs font-mono font-bold">${escapeHtml(orderId)}</span>
              <span class="text-xs text-slate-400">${escapeHtml(order.date)}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="${getStatusClass(key)} rounded-lg px-3 py-1 text-xs font-bold">وضعیت: ${escapeHtml(rawStatus || "ثبت شده")}</span>
              <select class="status-select border border-slate-300 bg-slate-50 rounded-lg px-2 py-2 text-xs" data-order-id="${escapeHtml(orderId)}">
                <option value="ثبت شده" ${rawStatus === "ثبت شده" ? "selected" : ""}>ثبت شده</option>
                <option value="در حال آماده‌سازی" ${rawStatus === "در حال آماده‌سازی" ? "selected" : ""}>در حال آماده‌سازی</option>
                <option value="ارسال شده" ${rawStatus === "ارسال شده" ? "selected" : ""}>ارسال شده</option>
                <option value="تحویل شده" ${rawStatus === "تحویل شده" ? "selected" : ""}>تحویل شده</option>
                <option value="لغو شده" ${rawStatus === "لغو شده" ? "selected" : ""}>لغو شده</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-5 text-sm">
            <div><p class="text-xs text-slate-400 mb-1">خریدار</p><p class="font-bold text-slate-800">${escapeHtml(order.name)}</p><p class="text-slate-600 mt-1">${escapeHtml(order.phone)}</p></div>
            <div><p class="text-xs text-slate-400 mb-1">محصول و مبلغ</p><p class="font-bold text-slate-800">${escapeHtml(order.product)}</p><p class="text-slate-600 mt-1">تعداد: ${escapeHtml(order.quantity)} | کل: ${escapeHtml(total)}</p></div>
            <div><p class="text-xs text-slate-400 mb-1">ارسال و پرداخت</p><p class="text-slate-700">روش: <strong>${escapeHtml(order.shippingMethod)}</strong></p><p class="text-slate-700 mt-1">کد رهگیری: <strong class="font-mono">${escapeHtml(order.paymentCode)}</strong></p></div>
          </div>
          <div class="mt-5 bg-slate-50 rounded-xl p-3 text-xs text-slate-600"><strong>آدرس:</strong> ${escapeHtml(order.city)}، ${escapeHtml(order.address)}</div>
        </article>`;
    }).join("");
  }

  async function updateStatus(orderId, newStatus) {
    const token = localStorage.getItem("shopyar_admin_token");
    if (!token) { logout(); return; }
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "update_status", token: token, orderId: orderId, status: newStatus })
      });
      const data = await res.json();
      if (data.status !== "success") throw new Error(data.message || "خطا در تغییر وضعیت");
      fetchOrders();
    } catch (err) {
      alert(err.message);
      fetchOrders();
    }
  }

  document.addEventListener("click", e => {
    const btn = e.target.closest(".filter-btn");
    if (btn) setFilter(btn.dataset.filter);
  });

  document.addEventListener("change", e => {
    const select = e.target.closest(".status-select");
    if (select) updateStatus(select.dataset.orderId, select.value);
  });

  document.getElementById("refreshBtn").addEventListener("click", fetchOrders);

  // بررسی توکن ذخیره‌شده هنگام بارگذاری صفحه
  window.addEventListener("DOMContentLoaded", () => {
    const token = localStorage.getItem("shopyar_admin_token");
    if (token) {
      document.getElementById("loginOverlay").classList.add("hidden");
      document.getElementById("adminMain").classList.remove("hidden");
      fetchOrders();
    }
  });
</script>
</body>
</html>
