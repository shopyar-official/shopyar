<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاپ‌یار | پنل مدیریت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style> body { font-family: 'Vazirmatn', sans-serif; } </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col justify-center items-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-6 text-center space-y-5">
        <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-3xl mx-auto shadow-inner">
            📊
        </div>
        <h1 class="text-xl font-bold text-gray-900">مدیریت سفارش‌های شاپ‌یار</h1>
        
        <p class="text-xs text-gray-600 leading-relaxed">
            برای مشاهده سفارش‌ها، روی دکمه زیر بزنید یا لینک را کپی کنید:
        </p>

        <div class="space-y-3 pt-2">
            <!-- دکمه باز کردن با پروتکل استاندارد -->
            <a href="https://docs.google.com/spreadsheets/d/1RuO05RJnXdxDkG4p5TPCS8RWaMn18bk5DtwgadU/edit" 
               target="_blank" 
               rel="noopener noreferrer"
               class="flex items-center justify-center gap-2 w-full bg-green-600 hover:bg-green-700 text-white text-sm py-3 rounded-xl transition font-medium shadow-md">
                <span>باز کردن جدول سفارش‌ها</span>
            </a>

            <!-- دکمه کپی لینک برای مواقع ضروری -->
            <button onclick="navigator.clipboard.writeText('https://docs.google.com/spreadsheets/d/1RuO05RJnXdxDkG4p5TPCS8RWaMn18bk5DtwgadU/edit'); alert('لینک گوگل‌شیت کپی شد! در مرورگر یا اپلیکیشن گوگل‌شیت پیست کنید.');" 
                    class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs py-2.5 rounded-xl transition">
                📋 کپی کردن لینک جدول
            </button>
            
            <a href="index.html" class="block w-full bg-gray-50 hover:bg-gray-100 text-gray-500 text-xs py-2.5 rounded-xl transition mt-2">
                بازگشت به صفحه فروشگاه
            </a>
        </div>
    </div>

</body>
</html>
