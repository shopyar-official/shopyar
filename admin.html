<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت سفارشات - شاپ‌یار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen pb-12">

    <header class="bg-white border-b border-gray-100 sticky top-0 z-30 px-4 py-3.5 shadow-sm">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-900 flex items-center justify-center text-amber-400 font-bold">ش</div>
                <div>
                    <h1 class="font-bold text-sm text-gray-800">پنل مدیریت سفارشات</h1>
                    <p class="text-[10px] text-gray-400">سیستم مدیریت شاپ‌یار</p>
                </div>
            </div>
            <button onclick="loadOrders()" class="bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-indigo-100 transition">
                بروزرسانی لیست
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 mt-2">
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center">
                <h2 class="font-bold text-sm text-gray-800">لیست سفارشات ثبت شده</h2>
                <span id="orderCount" class="text-xs text-gray-400">در حال دریافت...</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-xs">
                    <thead class="bg-gray-50 text-gray-500 border-b border-gray-100">
                        <tr>
                            <th class="p-3">نام مشتری</th>
                            <th class="p-3">تلفن</th>
                            <th class="p-3">شهر</th>
                            <th class="p-3">محصول / جزئیات</th>
                            <th class="p-3">آدرس</th>
                            <th class="p-3">تاریخ ثبت</th>
                            <th class="p-3">وضعیت</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody" class="divide-y divide-gray-100 text-gray-700">
                        <tr>
                            <td colspan="7" class="p-6 text-center text-gray-400">در حال بارگذاری اطلاعات از گوگل‌شیت...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec';

        async function loadOrders() {
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-400">در حال دریافت اطلاعات...</td></tr>`;

            try {
                const response = await fetch(SCRIPT_URL + '?action=get_orders');
                const orders = await response.json();

                tbody.innerHTML = '';
                document.getElementById('orderCount').textContent = `تعداد کل: ${orders.length} سفارش`;

                if (orders.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-400">هیچ سفارشی ثبت نشده است.</td></tr>`;
                    return;
                }

                orders.forEach(o => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition';
                    tr.innerHTML = `
                        <td class="p-3 font-bold text-gray-800">${o.orderId || '-'}</td>
                        <td class="p-3">${o.date || '-'}</td>
                        <td class="p-3">${o.name || '-'}</td>
                        <td class="p-3">${o.phone || '-'}</td>
                        <td class="p-3">${o.city || '-'}</td>
                        <td class="p-3 max-w-xs truncate" title="${o.address}">${o.address || '-'}</td>
                        <td class="p-3">${o.product || '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-red-500">خطا در دریافت اطلاعات از سرور. لطفاً صفحه را رفرش کنید.</td></tr>`;
            }
        }

        loadOrders();
    </script>
</body>
</html>
