<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت سفارشات - شاپ‌یار</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>body{font-family:'Vazirmatn',sans-serif}</style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

<main class="max-w-6xl w-full mx-auto">
  <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">📦 مدیریت سفارشات شاپ‌یار</h1>
      <p class="text-sm text-slate-500 mt-1">بررسی پرداخت‌ها و مدیریت وضعیت سفارش‌ها</p>
    </div>
    <button onclick="loadOrders()" class="bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 px-4 py-2 rounded-xl text-sm shadow-sm">
      🔄 به‌روزرسانی
    </button>
  </header>

  <div class="mb-5">
    <input id="searchInput" oninput="renderOrders()" type="search"
      placeholder="جستجو با نام، تلفن یا کد سفارش..."
      class="w-full bg-white border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
  </div>

  <section class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 mb-6">
    <button onclick="filterOrders('همه')" id="filter-all" class="filter-card border-orange-500">
      همه <b id="count-all">۰</b>
    </button>
    <button onclick="filterOrders('منتظر تأیید')" id="filter-waiting" class="filter-card">
      منتظر تأیید <b id="count-waiting">۰</b>
    </button>
    <button onclick="filterOrders('در حال بررسی')" id="filter-review" class="filter-card">
      در حال بررسی <b id="count-review">۰</b>
    </button>
    <button onclick="filterOrders('در حال آماده‌سازی')" id="filter-prep" class="filter-card">
      در حال آماده‌سازی <b id="count-prep">۰</b>
    </button>
    <button onclick="filterOrders('ارسال شده')" id="filter-sent" class="filter-card">
      ارسال شده <b id="count-sent">۰</b>
    </button>
    <button onclick="filterOrders('تکمیل شده')" id="filter-done" class="filter-card">
      تکمیل شده <b id="count-done">۰</b>
    </button>
    <button onclick="filterOrders('رد شده')" id="filter-rejected" class="filter-card">
      رد شده <b id="count-rejected" class="text-rose-600">۰</b>
    </button>
  </section>

  <section id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div class="col-span-full text-center py-12 text-slate-400">در حال بارگذاری سفارش‌ها...</div>
  </section>
</main>

<div id="confirmModal" class="fixed inset-0 bg-slate-900/50 z-50 hidden items-center justify-center p-4">
  <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-xl">
    <h2 class="font-bold text-lg mb-4">بررسی و تأیید سفارش</h2>
    <div class="bg-orange-50 rounded-xl p-3 text-sm space-y-2 mb-4">
      <div><b>کد رهگیری پرداخت:</b> <span id="modalPaymentCode">ثبت نشده</span></div>
      <div><b>روش ارسال:</b> <span id="modalShipping">ثبت نشده</span></div>
      <div id="modalReceiptRow"><b>فیش واریزی:</b> <a id="modalReceiptLink" target="_blank" rel="noopener" class="text-orange-600 underline font-bold">مشاهده فیش</a></div>
      <div id="modalNoReceipt" class="hidden text-slate-500">فیشی آپلود نشده است.</div>
    </div>
    <p class="text-xs text-slate-500 mb-4">پس از بررسی اطلاعات پرداخت، سفارش را تأیید کنید.</p>
    <div class="flex gap-2">
      <button onclick="closeModal()" class="flex-1 bg-slate-100 py-3 rounded-xl">انصراف</button>
      <button id="confirmBtn" class="flex-1 bg-orange-500 text-white py-3 rounded-xl font-bold">تأیید سفارش</button>
    </div>
  </div>
</div>

<style>
.filter-card{
  background:white;border:2px solid transparent;border-radius:1rem;
  padding:1rem .6rem;box-shadow:0 1px 3px #0000000d;
  display:flex;flex-direction:column;gap:.35rem;align-items:center;
  font-size:.75rem;color:#475569
}
.filter-card b{font-size:1.2rem;color:#0f172a}
</style>

<script>
