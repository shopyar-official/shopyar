<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت سفارشات - شاپ‌یار</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>body{font-family:'Vazirmatn',sans-serif}</style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

<main class="max-w-6xl w-full mx-auto">
  <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 bg-amber-500 rounded-xl flex items-center justify-center text-white font-bold text-2xl shadow-md shadow-amber-200">
        ش
      </div>
      <div>
        <h1 class="text-xl font-bold text-slate-800">پنل مدیریت شاپ‌یار</h1>
        <p class="text-xs text-slate-500 mt-1">مدیریت و پیگیری سفارش‌های ثبت‌شده</p>
      </div>
    </div>
    
    <div class="flex items-center gap-3 w-full md:w-auto">
      <button onclick="fetchOrders()" class="flex-1 md:flex-initial flex items-center justify-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-sm font-medium transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        بروزرسانی لیست
      </button>
    </div>
  </header>

  <!-- فیلترها و آمار -->
  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-6">
    <button onclick="setFilter('all')" id="filter-all" class="filter-btn bg-white border-2 border-amber-500 p-4 rounded-xl text-right transition shadow-sm">
      <span class="text-xs text-slate-500 font-medium block">همه سفارش‌ها</span>
      <span id="count-all" class="text-2xl font-bold text-slate-800 block mt-1">0</span>
    </button>
    
    <button onclick="setFilter('در انتظار پرداخت')" id="filter-pending-pay" class="filter-btn bg-white border border-slate-200 p-4 rounded-xl text-right transition hover:border-slate-300">
      <span class="text-xs text-yellow-600 font-medium block">در انتظار پرداخت</span>
      <span id="count-pending-pay" class="text-2xl font-bold text-yellow-600 block mt-1">0</span>
    </button>

    <button onclick="setFilter('منتظر تأیید')" id="filter-pending" class="filter-btn bg-white border border-slate-200 p-4 rounded-xl text-right transition hover:border-slate-300">
      <span class="text-xs text-amber-600 font-medium block">منتظر تأیید</span>
      <span id="count-pending" class="text-2xl font-bold text-amber-600 block mt-1">0</span>
    </button>

    <button onclick="setFilter('در حال پردازش')" id="filter-processing" class="filter-btn bg-white border border-slate-200 p-4 rounded-xl text-right transition hover:border-slate-300">
      <span class="text-xs text-blue-600 font-medium block">در حال پردازش</span>
      <span id="count-processing" class="text-2xl font-bold text-blue-600 block mt-1">0</span>
    </button>

    <button onclick="setFilter('ارسال شده')" id="filter-shipped" class="filter-btn bg-white border border-slate-200 p-4 rounded-xl text-right transition hover:border-slate-300">
      <span class="text-xs text-emerald-600 font-medium block">ارسال شده</span>
      <span id="count-shipped" class="text-2xl font-bold text-emerald-600 block mt-1">0</span>
    </button>

    <button onclick="setFilter('رد شده')" id="filter-rejected" class="filter-btn bg-white border border-slate-200 p-4 rounded-xl text-right transition hover:border-slate-300">
      <span class="text-xs text-rose-600 font-medium block">رد شده</span>
      <span id="count-rejected" class="text-2xl font-bold text-rose-600 block mt-1">0</span>
    </button>
  </div>

  <!-- لیست سفارشات -->
  <div id="orders-container" class="space-y-4">
    <div class="text-center py-12 bg-white rounded-2xl border border-slate-100 text-slate-500">
      در حال بارگذاری سفارشات...
    </div>
  </div>
</main>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec";
  let allOrders = [];
  let currentFilter = 'all';

  function normStatus(s) {
    return (s || '').replace(/[\u200B-\u200D\uFEFF]/g, '').replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/أ|إ|آ|ا/g, 'ا').replace(/ئ|ی/g, 'ی').trim();
  }

  function getOrderStatus(o) {
    return (o.status || o.Status || 'منتظر تأیید').trim();
  }

  function isPendingPay(st) {
    const s = normStatus(st);
    return s.includes('انتظار') && s.includes('پرداخت');
  }

  function isPending(st) {
    const s = normStatus(st);
    return (s.includes('منتظر') || s.includes('تایید')) && !s.includes('پرداخت');
  }

  function isProcessing(st) {
    const s = normStatus(st);
    return s.includes('پردازش');
  }

  function isShipped(st) {
    const s = normStatus(st);
    return s.includes('ارسال');
  }

  function isRejected(st) {
    const s = normStatus(st);
    return s.includes('رد');
  }

  async function fetchOrders() {
    const container = document.getElementById('orders-container');
    container.innerHTML = `
      <div class="text-center py-12 bg-white rounded-2xl border border-slate-100 text-slate-500">
        در حال بارگذاری سفارشات...
      </div>
    `;

    try {
      const res = await fetch(`${API_URL}?action=get_orders`);
      const data = await res.json();
      
      if (Array.isArray(data)) {
        allOrders = data;
      } else if (data && Array.isArray(data.data)) {
        allOrders = data.data;
      } else if (data && Array.isArray(data.orders)) {
        allOrders = data.orders;
      } else {
        allOrders = [];
      }

      updateCounts();
      renderOrders();
    } catch (err) {
      container.innerHTML = `
        <div class="text-center py-12 bg-rose-50 rounded-2xl border border-rose-200 text-rose-600">
          خطا در برقراری ارتباط با دیتابیس: ${err.message}
        </div>
      `;
    }
  }

  function updateCounts() {
    let counts = {
      all: allOrders.length,
      pendingPay: 0,
      pending: 0,
      processing: 0,
      shipped: 0,
      rejected: 0
    };

    allOrders.forEach(o => {
      const st = getOrderStatus(o);
      if (isPendingPay(st)) counts.pendingPay++;
      else if (isPending(st)) counts.pending++;
      else if (isProcessing(st)) counts.processing++;
      else if (isShipped(st)) counts.shipped++;
      else if (isRejected(st)) counts.rejected++;
    });

    document.getElementById('count-all').textContent = counts.all;
    document.getElementById('count-pending-pay').textContent = counts.pendingPay;
    document.getElementById('count-pending').textContent = counts.pending;
    document.getElementById('count-processing').textContent = counts.processing;
    document.getElementById('count-shipped').textContent = counts.shipped;
    document.getElementById('count-rejected').textContent = counts.rejected;
  }

  function setFilter(filter) {
    currentFilter = filter;
    
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.remove('border-amber-500', 'border-2');
      btn.classList.add('border-slate-200', 'border');
    });

    const activeMap = {
      'all': 'filter-all',
      'در انتظار پرداخت': 'filter-pending-pay',
      'منتظر تأیید': 'filter-pending',
      'در حال پردازش': 'filter-processing',
      'ارسال شده': 'filter-shipped',
      'رد شده': 'filter-rejected'
    };
    
    const activeBtn = document.getElementById(activeMap[filter]);
    if (activeBtn) {
      activeBtn.classList.remove('border-slate-200', 'border');
      activeBtn.classList.add('border-amber-500', 'border-2');
    }

    renderOrders();
  }

  function renderOrders() {
    const container = document.getElementById('orders-container');
    
    let filtered = allOrders;
    if (currentFilter !== 'all') {
      filtered = allOrders.filter(o => {
        const st = getOrderStatus(o);
        if (currentFilter === 'در انتظار پرداخت') return isPendingPay(st);
        if (currentFilter === 'منتظر تأیید') return isPending(st);
        if (currentFilter === 'در حال پردازش') return isProcessing(st);
        if (currentFilter === 'ارسال شده') return isShipped(st);
        if (currentFilter === 'رد شده') return isRejected(st);
        return st === currentFilter;
      });
    }

    if (!filtered || filtered.length === 0) {
      container.innerHTML = `
        <div class="text-center py-12 bg-white rounded-2xl border border-slate-100 text-slate-500">
          سفارشی در این وضعیت یافت نشد.
        </div>
      `;
      return;
    }

    container.innerHTML = filtered.map(order => {
      const orderId = order.orderId || order.orderID || order.id || '---';
      const name = order.name || 'بدون نام';
      const phone = order.phone || 'بدون شماره';
      const city = order.city || '---';
      const address = order.address || '---';
      const product = order.product || '---';
      const count = order.quantity || order.count || 1;
      const totalNum = order.totalAmount || order.total;
      const total = totalNum ? Number(totalNum).toLocaleString('fa-IR') + ' تومان' : '---';
      const date = order.date || '---';
      const receipt = order.receiptUrl || order.receipt || '';
      const tracking = order.paymentCode || order.tracking || '---';
      const shippingMethod = order.shippingMethod || 'پست پیشتاز';
      const status = getOrderStatus(order);
      const isNeedsAction = isPending(status) || isPendingPay(status);

      return `
        <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-3">
            <div class="flex items-center gap-2">
              <span class="text-xs bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg font-mono font-bold">${orderId}</span>
              <span class="text-xs text-slate-400">${date}</span>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
              ${isNeedsAction ? `
                <button type="button" onclick="changeStatus('${orderId}', 'در حال پردازش')" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-1 shadow-sm">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                  </svg>
                  تأیید سفارش
                </button>
                <button type="button" onclick="changeStatus('${orderId}', 'رد شده')" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium px-2.5 py-1.5 rounded-lg transition border border-rose-200">
                  رد سفارش
                </button>
              ` : ''}

              <select onchange="changeStatus('${orderId}', this.value)" class="text-xs font-medium border border-slate-300 rounded-lg p-1.5 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-amber-500">
                <option value="در انتظار پرداخت" ${isPendingPay(status) ? 'selected' : ''}>در انتظار پرداخت</option>
                <option value="منتظر تأیید" ${isPending(status) ? 'selected' : ''}>منتظر تأیید</option>
                <option value="در حال پردازش" ${isProcessing(status) ? 'selected' : ''}>در حال پردازش</option>
                <option value="ارسال شده" ${isShipped(status) ? 'selected' : ''}>ارسال شده</option>
                <option value="رد شده" ${isRejected(status) ? 'selected' : ''}>رد شده</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
            <div>
              <p class="text-xs text-slate-400">اطلاعات خریدار:</p>
              <p class="font-bold text-slate-800 mt-0.5">${name}</p>
              <p class="text-slate-600 text-xs mt-0.5 dir-ltr text-right">${phone}</p>
            </div>
            
            <div>
              <p class="text-xs text-slate-400">محصول و تعداد:</p>
              <p class="font-bold text-slate-800 mt-0.5">${product}</p>
              <p class="text-slate-600 text-xs mt-0.5">تعداد: ${count} | کل: ${total}</p>
            </div>

            <div>
              <p class="text-xs text-slate-400">ارسال و پرداخت:</p>
              <p class="text-slate-700 text-xs mt-0.5">روش ارسال: <span class="font-semibold text-slate-900">${shippingMethod}</span></p>
              <p class="text-slate-700 text-xs mt-0.5">کد رهگیری: <span class="font-mono text-slate-900 font-bold">${tracking}</span></p>
            </div>
          </div>

          <div class="bg-slate-50 p-3 rounded-xl text-xs text-slate-600 flex flex-col md:flex-row md:items-center justify-between gap-2">
            <div>
              <span class="font-semibold text-slate-700">آدرس:</span> ${city}، ${address}
            </div>
            ${receipt ? `
              <a href="${receipt}" target="_blank" class="inline-flex items-center gap-1 text-amber-600 hover:text-amber-700 font-medium shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                مشاهده تصویر فیش
              </a>
            ` : '<span class="text-slate-400">بدون فیش</span>'}
          </div>
        </div>
      `;
    }).join('');
  }

  async function changeStatus(orderId, newStatus) {
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          action: 'update_status',
          orderId: orderId,
          orderID: orderId,
          status: newStatus
        })
      });
      const result = await res.json();
      if (result.status === 'success') {
        const ord = allOrders.find(o => (o.orderId || o.orderID || o.id) == orderId);
        if (ord) ord.status = newStatus;
        updateCounts();
        renderOrders();
      } else {
        alert('خطا در تغییر وضعیت: ' + (result.message || 'نامشخص'));
      }
    } catch (err) {
      alert('خطا در ارتباط با سرور');
    }
  }

  // بارگذاری اولیه
  fetchOrders();
</script>
</body>
</html>
