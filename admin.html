<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت سفارشات - شاپ‌یار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- هدر صفحه -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">📦 مدیریت سفارشات شاپ‌یار</h1>
                <p class="text-sm text-slate-500 mt-1">مدیریت و پیگیری سفارشات ثبت شده مشتریان</p>
            </div>
            <button onclick="loadOrders()" class="bg-white border border-slate-200 text-slate-700 hover:bg-slate-100 px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm flex items-center gap-2">
                🔄 به‌روزرسانی لیست
            </button>
        </div>

        <!-- کارت‌های وضعیت بالا (تب‌های فیلتر پویا) -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
            <div onclick="filterOrders('همه')" id="card-all" class="cursor-pointer bg-white border-2 border-orange-500 rounded-2xl p-4 shadow-sm transition hover:shadow-md text-center">
                <div class="text-xs text-slate-500 font-medium">همه سفارش‌ها</div>
                <div id="count-all" class="text-xl font-bold text-slate-800 mt-1">۰</div>
            </div>
            <div onclick="filterOrders('در حال بررسی')" id="card-pending" class="cursor-pointer bg-white border-2 border-transparent hover:border-amber-400 rounded-2xl p-4 shadow-sm transition hover:shadow-md text-center">
                <div class="text-xs text-amber-600 font-medium">در حال بررسی</div>
                <div id="count-pending" class="text-xl font-bold text-amber-600 mt-1">۰</div>
            </div>
            <div onclick="filterOrders('در حال آماده‌سازی')" id="card-prep" class="cursor-pointer bg-white border-2 border-transparent hover:border-blue-400 rounded-2xl p-4 shadow-sm transition hover:shadow-md text-center">
                <div class="text-xs text-blue-600 font-medium">در حال آماده‌سازی</div>
                <div id="count-prep" class="text-xl font-bold text-blue-600 mt-1">۰</div>
            </div>
            <div onclick="filterOrders('ارسال شده')" id="card-sent" class="cursor-pointer bg-white border-2 border-transparent hover:border-purple-400 rounded-2xl p-4 shadow-sm transition hover:shadow-md text-center">
                <div class="text-xs text-purple-600 font-medium">ارسال شده</div>
                <div id="count-sent" class="text-xl font-bold text-purple-600 mt-1">۰</div>
            </div>
            <div onclick="filterOrders('تکمیل شده')" id="card-completed" class="cursor-pointer bg-white border-2 border-transparent hover:border-emerald-400 rounded-2xl p-4 shadow-sm transition hover:shadow-md text-center col-span-2 md:col-span-1">
                <div class="text-xs text-emerald-600 font-medium">تکمیل شده</div>
                <div id="count-completed" class="text-xl font-bold text-emerald-600 mt-1">۰</div>
            </div>
        </div>

        <!-- لیست سفارشات -->
        <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="col-span-full text-center py-12 text-slate-400">در حال بارگذاری سفارشات...</div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec';
        let allOrders = [];
        let currentFilter = 'همه';

        window.addEventListener('DOMContentLoaded', loadOrders);

        function loadOrders() {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = '<div class="col-span-full text-center py-12 text-slate-400">در حال بارگذاری...</div>';

            fetch(`${SCRIPT_URL}?action=get_orders`)
                .then(res => res.json())
                .then(data => {
                    if(Array.isArray(data)) {
                        allOrders = data;
                        updateCounts();
                        renderOrders();
                    } else {
                        container.innerHTML = '<div class="col-span-full text-center py-12 text-rose-500">خطا در دریافت اطلاعات از سرور</div>';
                    }
                })
                .catch(err => {
                    console.error(err);
                    container.innerHTML = '<div class="col-span-full text-center py-12 text-rose-500">خطا در اتصال به سرور</div>';
                });
        }

        function updateCounts() {
            const counts = {
                'همه': allOrders.length,
                'در حال بررسی': allOrders.filter(o => (o.status || 'در حال بررسی') === 'در حال بررسی').length,
                'در حال آماده‌سازی': allOrders.filter(o => o.status === 'در حال آماده‌سازی').length,
                'ارسال شده': allOrders.filter(o => o.status === 'ارسال شده').length,
                'تکمیل شده': allOrders.filter(o => o.status === 'تکمیل شده').length,
            };

            document.getElementById('count-all').textContent = counts['همه'];
            document.getElementById('count-pending').textContent = counts['در حال بررسی'];
            document.getElementById('count-prep').textContent = counts['در حال آماده‌سازی'];
            document.getElementById('count-sent').textContent = counts['ارسال شده'];
            document.getElementById('count-completed').textContent = counts['تکمیل شده'];
        }

        function filterOrders(status) {
            currentFilter = status;
            
            // استایل فعال برای کارت‌های بالا
            const cards = {
                'همه': 'card-all',
                'در حال بررسی': 'card-pending',
                'در حال آماده‌سازی': 'card-prep',
                'ارسال شده': 'card-sent',
                'تکمیل شده': 'card-completed'
            };

            for (const [key, id] of Object.entries(cards)) {
                const el = document.getElementById(id);
                if (key === status) {
                    el.className = 'cursor-pointer bg-white border-2 border-orange-500 rounded-2xl p-4 shadow-sm transition hover:shadow-md text-center';
                } else {
                    el.className = 'cursor-pointer bg-white border-2 border-transparent hover:border-slate-300 rounded-2xl p-4 shadow-sm transition hover:shadow-md text-center';
                }
            }

            renderOrders();
        }

        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            
            let filtered = allOrders;
            if (currentFilter !== 'همه') {
                filtered = allOrders.filter(o => (o.status || 'در حال بررسی') === currentFilter);
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-slate-400 bg-white rounded-2xl border border-slate-100">هیچ سفارشی در این وضعیت وجود ندارد</div>';
                return;
            }

            container.innerHTML = '';
            filtered.forEach(order => {
                const status = order.status || 'در حال بررسی';
                
                let badgeColor = 'bg-amber-50 text-amber-700 border-amber-200';
                if (status === 'در حال آماده‌سازی') badgeColor = 'bg-blue-50 text-blue-700 border-blue-200';
                if (status === 'ارسال شده') badgeColor = 'bg-purple-50 text-purple-700 border-purple-200';
                if (status === 'تکمیل شده') badgeColor = 'bg-emerald-50 text-emerald-700 border-emerald-200';

                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl border border-slate-100 p-5 shadow-sm flex flex-col justify-between gap-4';
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-bold text-orange-600 bg-orange-50 px-2.5 py-1 rounded-lg">${order.orderId}</span>
                            <span class="text-xs px-2.5 py-1 rounded-lg border font-medium ${badgeColor}">${status}</span>
                        </div>
                        <h3 class="text-base font-bold text-slate-800 mb-1">${order.name || 'بدون نام'}</h3>
                        <p class="text-xs text-slate-500 mb-3 flex items-center gap-1">📞 <a href="tel:${order.phone}" class="hover:text-orange-600">${order.phone}</a></p>
                        
                        <div class="bg-slate-50 rounded-xl p-3 text-xs space-y-1.5 text-slate-600 mb-3">
                            <div><strong class="text-slate-700">شهر:</strong> ${order.city}</div>
                            <div><strong class="text-slate-700">آدرس:</strong> ${order.address}</div>
                            <div><strong class="text-slate-700">خرید:</strong> ${order.product}</div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-3 border-t border-slate-100 gap-2">
                        <span class="text-[11px] text-slate-400">${order.date}</span>
                        <select onchange="updateStatus('${order.orderId}', this.value)" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium text-slate-700">
                            <option value="" disabled selected>تغییر وضعیت...</option>
                            <option value="در حال بررسی">در حال بررسی</option>
                            <option value="در حال آماده‌سازی">در حال آماده‌سازی</option>
                            <option value="ارسال شده">ارسال شده</option>
                            <option value="تکمیل شده">تکمیل شده</option>
                        </select>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateStatus(orderId, newStatus) {
            const formData = new URLSearchParams({
                action: 'update_status',
                orderId: orderId,
                status: newStatus
            });

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    // به‌روزرسانی محلی و بازرندر کردن بدون نیاز به رفرش کامل
                    const order = allOrders.find(o => o.orderId === orderId);
                    if(order) order.status = newStatus;
                    updateCounts();
                    renderOrders();
                } else {
                    alert('خطا در به‌روزرسانی وضعیت');
                }
            })
            .catch(err => {
                console.error(err);
                alert('خطا در اتصال به سرور');
            });
        }
    </script>
</body>
</html>
