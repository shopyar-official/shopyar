<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت سفارشات - شاپ‌یار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen pb-16">

    <!-- Header -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-30 px-4 py-3.5 shadow-sm">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center text-white shadow-md shadow-orange-500/20 font-bold text-lg">
                    ش
                </div>
                <div>
                    <h1 class="font-bold text-sm text-gray-800">مدیریت سفارشات شاپ‌یار</h1>
                    <p class="text-[10px] text-gray-400">پنل اختصاصی فروشگاه شما</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="loadOrders()" class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded-xl text-xs font-medium hover:bg-gray-200 transition flex items-center gap-1">
                    <span>🔄</span> بروزرسانی
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-4">
        <!-- Stats Cards (4 Statuses) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5">
            <div onclick="filterByStatus('all')" id="card-all" class="bg-white p-3 rounded-2xl border-2 border-indigo-500 shadow-sm text-center cursor-pointer transition hover:scale-[1.02]">
                <span class="text-[10px] text-gray-400 block mb-1">همه سفارش‌ها</span>
                <span id="statAll" class="text-base font-bold text-indigo-600">۰</span>
            </div>
            <div onclick="filterByStatus('در حال بررسی')" id="card-در حال بررسی" class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm text-center cursor-pointer transition hover:scale-[1.02]">
                <span class="text-[10px] text-amber-500 block mb-1">در حال بررسی</span>
                <span id="statPending" class="text-base font-bold text-amber-600">۰</span>
            </div>
            <div onclick="filterByStatus('در حال آماده‌سازی')" id="card-در حال آماده‌سازی" class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm text-center cursor-pointer transition hover:scale-[1.02]">
                <span class="text-[10px] text-blue-500 block mb-1">در حال آماده‌سازی</span>
                <span id="statPreparing" class="text-base font-bold text-blue-600">۰</span>
            </div>
            <div onclick="filterByStatus('تکمیل شده')" id="card-تکمیل شده" class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm text-center cursor-pointer transition hover:scale-[1.02]">
                <span class="text-[10px] text-emerald-500 block mb-1">تکمیل شده</span>
                <span id="statCompleted" class="text-base font-bold text-emerald-600">۰</span>
            </div>
        </div>

        <!-- Orders Header & List Container -->
        <div class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 id="tableTitle" class="font-bold text-xs text-gray-700">لیست همه سفارشات</h2>
                <span id="orderCountBadge" class="text-[11px] bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full font-medium">در حال دریافت...</span>
            </div>

            <!-- Orders Cards Container -->
            <div id="ordersContainer" class="space-y-3">
                <div class="bg-white p-8 rounded-2xl text-center text-gray-400 text-xs border border-gray-100 shadow-sm">
                    در حال بارگذاری اطلاعات از گوگل‌شیت...
                </div>
            </div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec';
        let allOrders = [];
        let currentFilter = 'all';

        function loadOrders() {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-gray-400 text-xs border border-gray-100 shadow-sm">در حال دریافت اطلاعات...</div>`;

            const xhr = new XMLHttpRequest();
            xhr.open('GET', SCRIPT_URL + '?action=get_orders', true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            allOrders = JSON.parse(xhr.responseText);
                            updateStats();
                            renderCards();
                        } catch (e) {
                            container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-red-500 text-xs border border-gray-100 shadow-sm">خطا در پردازش داده‌ها.</div>`;
                        }
                    } else {
                        container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-red-500 text-xs border border-gray-100 shadow-sm">خطا در ارتباط با سرور.</div>`;
                    }
                }
            };
            xhr.send();
        }

        function updateStats() {
            let total = allOrders.length;
            let pending = 0;
            let preparing = 0;
            let completed = 0;

            allOrders.forEach(o => {
                let s = (o.status || 'در حال بررسی').trim();
                if (s.includes('آماده‌سازی')) preparing++;
                else if (s.includes('تکمیل')) completed++;
                else pending++;
            });

            document.getElementById('statAll').textContent = total;
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statPreparing').textContent = preparing;
            document.getElementById('statCompleted').textContent = completed;
        }

        function filterByStatus(status) {
            currentFilter = status;
            
            ['all', 'در حال بررسی', 'در حال آماده‌سازی', 'تکمیل شده'].forEach(s => {
                const card = document.getElementById('card-' + s);
                if (s === status) {
                    card.className = 'bg-white p-3 rounded-2xl border-2 border-indigo-500 shadow-sm text-center cursor-pointer transition hover:scale-[1.02]';
                } else {
                    card.className = 'bg-white p-3 rounded-2xl border border-gray-100 shadow-sm text-center cursor-pointer transition hover:scale-[1.02]';
                }
            });

            renderCards();
        }

        function updateOrderStatus(orderId, newStatus) {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', SCRIPT_URL, true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    // بروزرسانی محلی در آرایه برای واکنش سریع
                    const target = allOrders.find(o => o.orderId == orderId);
                    if (target) target.status = newStatus;
                    updateStats();
                    renderCards();
                }
            };
            xhr.send(`action=update_status&orderId=${encodeURIComponent(orderId)}&status=${encodeURIComponent(newStatus)}`);
        }

        function renderCards() {
            const container = document.getElementById('ordersContainer');
            let filtered = allOrders;

            if (currentFilter !== 'all') {
                filtered = allOrders.filter(o => {
                    let s = (o.status || 'در حال بررسی').trim();
                    if (currentFilter === 'در حال بررسی') return s === 'در حال بررسی' || (!s.includes('آماده‌سازی') && !s.includes('تکمیل') && !s.includes('ارسال'));
                    if (currentFilter === 'در حال آماده‌سازی') return s.includes('آماده‌سازی');
                    if (currentFilter === 'تکمیل شده') return s.includes('تکمیل');
                    return s === currentFilter;
                });
                document.getElementById('tableTitle').textContent = `سفارش‌های وضعیت: ${currentFilter}`;
            } else {
                document.getElementById('tableTitle').textContent = 'لیست همه سفارشات';
            }

            document.getElementById('orderCountBadge').textContent = `${filtered.length} سفارش`;
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-gray-400 text-xs border border-gray-100 shadow-sm">هیچ سفارشی در این وضعیت وجود ندارد.</div>`;
                return;
            }

            filtered.forEach(o => {
                const statusText = (o.status || 'در حال بررسی').trim();
                
                const cardDiv = document.createElement('div');
                cardDiv.className = 'bg-white p-4 rounded-2xl border border-gray-100 shadow-sm space-y-3 hover:shadow-md transition';
                cardDiv.innerHTML = `
                    <div class="flex justify-between items-center border-b border-gray-50 pb-2.5">
                        <div class="flex items-center gap-2">
                            <span class="w-7 h-7 rounded-xl bg-indigo-50 text-indigo-600 font-bold text-xs flex items-center justify-center">🛍️</span>
                            <span class="font-bold text-gray-800 text-xs">${o.orderId || 'بدون نام'}</span>
                        </div>
                        <select onchange="updateOrderStatus('${o.orderId}', this.value)" class="text-[11px] font-medium px-2.5 py-1 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:border-indigo-500 transition">
                            <option value="در حال بررسی" ${statusText === 'در حال بررسی' ? 'selected' : ''}>در حال بررسی</option>
                            <option value="در حال آماده‌سازی" ${statusText.includes('آماده‌سازی') ? 'selected' : ''}>در حال آماده‌سازی</option>
                            <option value="تکمیل شده" ${statusText.includes('تکمیل') ? 'selected' : ''}>تکمیل شده</option>
                        </select>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 text-[11px] text-gray-600 bg-gray-50/50 p-2.5 rounded-xl">
                        <div><span class="text-gray-400 ml-1">تلفن:</span><span class="font-mono">${o.date || '-'}</span></div>
                        <div><span class="text-gray-400 ml-1">شهر:</span><span class="font-medium text-gray-800">${o.name || '-'}</span></div>
                        <div class="col-span-2"><span class="text-gray-400 ml-1">محصول:</span><span class="font-semibold text-indigo-600">${o.city || '-'}</span></div>
                    </div>

                    <div class="text-[11px] text-gray-500">
                        <span class="text-gray-400 ml-1">آدرس:</span>${o.address || '-'}
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t border-gray-50 text-[10px] text-gray-400">
                        <span>تاریخ ثبت: ${o.product || '-'}</span>
                    </div>
                `;
                container.appendChild(cardDiv);
            });
        }

        loadOrders();
    </script>
</body>
</html>
