<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f7fb;color:#263248;font-family:Tahoma,Arial;padding:18px}
    main{max-width:1050px;margin:auto}
    .box,.order{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 8px 25px #182b420d}
    input,select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #cbd5e1}
    input{max-width:100%;margin:5px 0}
    button{background:#e66017;border:0;color:#fff;cursor:pointer;margin:5px}
    button:disabled{opacity:.55}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .toolbar input{flex:1;min-width:230px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
    .item{line-height:1.8;overflow-wrap:anywhere}
    .item b{display:block;color:#64748b;font-size:12px}
    .error{color:#b02727}
    .success{color:#087245}
    .muted{color:#64748b}
    .order h3{margin-top:0}
    .review{border-top:1px solid #edf0f4;padding:12px 0}
    .settings{border-top:1px solid #edf0f4;margin-top:16px;padding-top:16px}
    .settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
    @media(max-width:600px){body{padding:10px}.box,.order{padding:15px}}
  </style>
</head>
<body>
<main>
  <h1>مدیریت سفارش‌های شاپ‌یار</h1>

  <div id="loginBox" class="box">
    <p>برای ورود، نام کاربری و رمز عبور را وارد کنید.</p>
    <input id="username" type="text" placeholder="نام کاربری" autocomplete="username">
    <input id="password" type="password" placeholder="رمز مدیریت" autocomplete="current-password">
    <button id="loginButton" onclick="login()">ورود</button>
  </div>

  <div id="panel" hidden>
    <div class="box toolbar">
      <input id="search" placeholder="جست‌وجو در نام، تلفن، شهر یا محصول" oninput="renderOrders()">
      <button onclick="loadOrders()">تازه‌سازی</button>
      <button onclick="exportCsv()">خروجی Excel/CSV</button>
      <button onclick="logout()">خروج</button>
    </div>

    <p id="count" class="muted"></p>
    <div id="orders"></div>

    <div class="box">
      <h2>⭐ نظرات مشتریان</h2>
      <div id="reviews">در حال بارگذاری...</div>
    </div>

    <div class="box settings">
      <h2>تغییر اطلاعات ورود</h2>
      <div class="settings-grid">
        <input id="currentPassword" type="password" placeholder="رمز فعلی" autocomplete="current-password">
        <input id="newUsername" type="text" placeholder="نام کاربری جدید" autocomplete="username">
        <input id="newPassword" type="password" placeholder="رمز عبور جدید" autocomplete="new-password">
      </div>
      <button id="changeButton" onclick="changeCredentials()">ذخیره اطلاعات جدید</button>
      <p class="muted">رمز عبور جدید باید حداقل ۶ کاراکتر باشد.</p>
    </div>
  </div>

  <p id="message"></p>
</main>

<script>
  let token = '';
  let orders = [];
  const $ = id => document.getElementById(id);

  function showMessage(text, error) {
    $('message').textContent = text;
    $('message').className = error ? 'error' : 'success';
  }

  function login() {
    const username = $('username').value.trim();
    const password = $('password').value;

    if (!username || !password) {
      showMessage('نام کاربری و رمز عبور را وارد کنید.', true);
      return;
    }

    $('loginButton').disabled = true;

    google.script.run
      .withSuccessHandler(result => {
        token = result.token;
        $('password').value = '';
        $('loginButton').disabled = false;
        $('loginBox').hidden = true;
        $('panel').hidden = false;
        showMessage('', false);
        loadOrders();
      })
      .withFailureHandler(error => {
        $('loginButton').disabled = false;
        showMessage(error.message || 'ورود انجام نشد.', true);
      })
      .loginAdmin(username, password);
  }

  function logout() {
    const oldToken = token;
    token = '';
    orders = [];
    $('username').value = '';
    $('password').value = '';
    $('panel').hidden = true;
    $('loginBox').hidden = false;
    $('loginButton').disabled = false;

    if (oldToken) {
      google.script.run.logoutAdmin(oldToken);
    }

    showMessage('از پنل خارج شدید.', false);
  }

  function loadOrders() {
    if (!token) return;

    google.script.run
      .withSuccessHandler(data => {
        orders = Array.isArray(data) ? data : [];
        renderOrders();
        loadReviews();
      })
      .withFailureHandler(error => {
        if ((error.message || '').includes('نشست')) logout();
        else showMessage(error.message || 'دریافت سفارش‌ها انجام نشد.', true);
      })
      .getOrders(token);
  }

  function changeCredentials() {
    const currentPassword = $('currentPassword').value;
    const newUsername = $('newUsername').value.trim();
    const newPassword = $('newPassword').value;

    if (!currentPassword || !newUsername || !newPassword) {
      showMessage('هر سه فیلد تغییر اطلاعات را کامل کنید.', true);
      return;
    }

    $('changeButton').disabled = true;

    google.script.run
      .withSuccessHandler(result => {
        $('changeButton').disabled = false;
        $('currentPassword').value = '';
        $('newUsername').value = '';
        $('newPassword').value = '';
        token = '';
        $('panel').hidden = true;
        $('loginBox').hidden = false;
        $('username').value = newUsername;
        showMessage(result.message, false);
      })
      .withFailureHandler(error => {
        $('changeButton').disabled = false;
        showMessage(error.message || 'تغییر اطلاعات انجام نشد.', true);
      })
      .changeAdminCredentials(token, currentPassword, newUsername, newPassword);
  }

  function field(label, value) {
    const div = document.createElement('div');
    div.className = 'item';
    const title = document.createElement('b');
    title.textContent = label;
    const text = document.createElement('span');
    text.textContent = String(value == null || value === '' ? '—' : value);
    div.append(title, text);
    return div;
  }

  function renderOrders() {
    const search = $('search').value.trim().toLowerCase();
    const filtered = orders.filter(o =>
      [o.name, o.phone, o.city, o.product, o.code]
        .some(v => String(v || '').toLowerCase().includes(search))
    );

    $('count').textContent = filtered.length + ' سفارش';
    $('orders').replaceChildren();

    filtered.forEach(o => {
      const card = document.createElement('article');
      card.className = 'order';

      const title = document.createElement('h3');
      title.textContent = 'سفارش ' + o.code;
      card.append(title);

      const grid = document.createElement('div');
      grid.className = 'grid';

      [
        ['نام', o.name], ['موبایل', o.phone], ['شهر', o.city],
        ['آدرس', o.address], ['کد پستی', o.postalCode],
        ['محصول', o.product], ['تعداد', o.quantity],
        ['روش ارسال', o.shippingMethod], ['تاریخ', o.date],
        ['مبلغ کل', o.total === null ? 'تعیین نشده' :
          Number(o.total).toLocaleString('fa-IR') + ' تومان']
      ].forEach(([label, value]) => grid.append(field(label, value)));

      card.append(grid);

      const statusLabel = document.createElement('label');
      statusLabel.textContent = 'وضعیت: ';
      const select = document.createElement('select');

      [
        'ثبت شده', 'در حال آماده‌سازی', 'در حال بسته‌بندی',
        'ارسال شده', 'تحویل شده', 'لغو شده'
      ].forEach(status => {
        const option = document.createElement('option');
        option.value = status;
        option.textContent = status;
        option.selected = o.status === status;
        select.append(option);
      });

      select.addEventListener('change', () => {
        const previous = o.status;
        select.disabled = true;

        google.script.run
          .withSuccessHandler(() => {
            o.status = select.value;
            select.disabled = false;
            showMessage('وضعیت سفارش ' + o.code + ' ذخیره شد.', false);
          })
          .withFailureHandler(error => {
            select.value = previous;
            select.disabled = false;
            showMessage(error.message, true);
          })
          .updateOrderStatus(token, o.code, select.value);
      });

      statusLabel.append(select);
      card.append(statusLabel);

      const copy = document.createElement('button');
      copy.textContent = 'کپی موبایل';
      copy.onclick = () => navigator.clipboard.writeText(o.phone)
        .then(() => showMessage('شماره کپی شد.', false))
        .catch(() => showMessage('کپی خودکار ممکن نشد.', true));
      card.append(copy);

      $('orders').append(card);
    });
  }

  function loadReviews() {
    google.script.run
      .withSuccessHandler(items => {
        $('reviews').replaceChildren();
        if (!items.length) {
          $('reviews').textContent = 'هنوز نظری ثبت نشده است.';
          return;
        }
        items.forEach(r => {
          const div = document.createElement('div');
          div.className = 'review';
          div.textContent = r.rating + ' از ۵ | سفارش ' + r.code +
            ' | ' + r.comment + ' | ' + r.date;
          $('reviews').append(div);
        });
      })
      .withFailureHandler(error => {
        $('reviews').textContent = error.message;
      })
      .getReviews(token);
  }

  function csvCell(value) {
    let text = String(value == null ? '' : value);
    if (/^\s*[=+\-@]/.test(text)) text = "'" + text;
    return '"' + text.replace(/"/g, '""') + '"';
  }

  function exportCsv() {
    const lines = [
      ['کد سفارش','نام','تلفن','شهر','آدرس','محصول','تعداد',
       'تاریخ','وضعیت','کد پستی','روش ارسال','مبلغ کل'],
      ...orders.map(o => [
        o.code,o.name,o.phone,o.city,o.address,o.product,o.quantity,
        o.date,o.status,o.postalCode,o.shippingMethod,
        o.total === null ? '' : o.total
      ])
    ].map(row => row.map(csvCell).join(','));

    const blob = new Blob(['\uFEFF' + lines.join('\r\n')],
      {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'shopyar-orders.csv';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
</script>
</body>
</html>
