<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت سفارشات - شاپ‌یار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen pb-16">

    <!-- Header -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-30 px-4 py-3.5 shadow-sm">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center text-white shadow-md shadow-orange-500/20 font-bold text-lg">
                    ش
                </div>
                <div>
                    <h1 class="font-bold text-sm text-gray-800">مدیریت سفارشات شاپ‌یار</h1>
                    <p class="text-[10px] text-gray-400">پنل اختصاصی فروشگاه شما</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="loadOrders()" class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded-xl text-xs font-medium hover:bg-gray-200 transition flex items-center gap-1">
                    <span>🔄</span> بروزرسانی
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-4">
        <!-- Stats Cards (4 Statuses) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div onclick="filterByStatus('all')" id="card-all" class="bg-white p-3.5 rounded-2xl border-2 border-indigo-500 shadow-sm text-center cursor-pointer transition hover:scale-[1.02]">
                <span class="text-[11px] text-gray-400 block mb-1">همه سفارش‌ها</span>
                <span id="statAll" class="text-lg font-bold text-indigo-600">۰</span>
            </div>
            <div onclick="filterByStatus('در حال بررسی')" id="card-در حال بررسی" class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm text-center cursor-pointer transition hover:scale-[1.02]">
                <span class="text-[11px] text-amber-500 block mb-1">در حال بررسی</span>
                <span id="statPending" class="text-lg font-bold text-amber-600">۰</span>
            </div>
            <div onclick="filterByStatus('در حال آماده‌سازی')" id="card-در حال آماده‌سازی" class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm text-center cursor-pointer transition hover:scale-[1.02]">
                <span class="text-[11px] text-blue-500 block mb-1">در حال آماده‌سازی</span>
                <span id="statPreparing" class="text-lg font-bold text-blue-600">۰</span>
            </div>
            <div onclick="filterByStatus('تکمیل شده')" id="card-تکمیل شده" class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm text-center cursor-pointer transition hover:scale-[1.02]">
                <span class="text-[11px] text-emerald-500 block mb-1">تکمیل شده</span>
                <span id="statCompleted" class="text-lg font-bold text-emerald-600">۰</span>
            </div>
        </div>

        <!-- Orders Table Card -->
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h2 id="tableTitle" class="font-bold text-sm text-gray-800">لیست همه سفارشات</h2>
                <span id="orderCountBadge" class="text-xs bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full font-medium">در حال دریافت...</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-xs">
                    <thead class="bg-gray-50 text-gray-400 border-b border-gray-100 text-[11px]">
                        <tr>
                            <th class="p-3 font-medium">مشتری</th>
                            <th class="p-3 font-medium">تلفن</th>
                            <th class="p-3 font-medium">شهر</th>
                            <th class="p-3 font-medium">محصول</th>
                            <th class="p-3 font-medium">آدرس</th>
                            <th class="p-3 font-medium">تاریخ ثبت</th>
                            <th class="p-3 font-medium text-center">وضعیت</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody" class="divide-y divide-gray-100 text-gray-700">
                        <tr>
                            <td colspan="7" class="p-8 text-center text-gray-400">در حال بارگذاری اطلاعات از گوگل‌شیت...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec';
        let allOrders = [];
        let currentFilter = 'all';

        function loadOrders() {
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-gray-400">در حال دریافت اطلاعات...</td></tr>`;

            const xhr = new XMLHttpRequest();
            xhr.open('GET', SCRIPT_URL + '?action=get_orders', true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            allOrders = JSON.parse(xhr.responseText);
                            updateStats();
                            renderTable();
                        } catch (e) {
                            tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-500">خطا در پردازش داده‌ها.</td></tr>`;
                        }
                    } else {
                        tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-red-500">خطا در ارتباط با سرور.</td></tr>`;
                    }
                }
            };
            xhr.send();
        }

        function updateStats() {
            let total = allOrders.length;
            let pending = 0;
            let preparing = 0;
            let completed = 0;

            allOrders.forEach(o => {
                let s = (o.status || 'در حال بررسی').trim();
                if (s.includes('آماده‌سازی')) preparing++;
                else if (s.includes('تکمیل')) completed++;
                else pending++;
            });

            document.getElementById('statAll').textContent = total;
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statPreparing').textContent = preparing;
            document.getElementById('statCompleted').textContent = completed;
        }

        function filterByStatus(status) {
            currentFilter = status;
            
            ['all', 'در حال بررسی', 'در حال آماده‌سازی', 'تکمیل شده'].forEach(s => {
                const card = document.getElementById('card-' + s);
                if (s === status) {
                    card.className = 'bg-white p-3.5 rounded-2xl border-2 border-indigo-500 shadow-sm text-center cursor-pointer transition hover:scale-[1.02]';
                } else {
                    card.className = 'bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm text-center cursor-pointer transition hover:scale-[1.02]';
                }
            });

            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('ordersTableBody');
            let filtered = allOrders;

            if (currentFilter !== 'all') {
                filtered = allOrders.filter(o => {
                    let s = (o.status || 'در حال بررسی').trim();
                    if (currentFilter === 'در حال بررسی') return s === 'در حال بررسی' || (!s.includes('آماده‌سازی') && !s.includes('تکمیل') && !s.includes('ارسال'));
                    if (currentFilter === 'در حال آماده‌سازی') return s.includes('آماده‌سازی');
                    if (currentFilter === 'تکمیل شده') return s.includes('تکمیل');
                    return s === currentFilter;
                });
                document.getElementById('tableTitle').textContent = `سفارش‌های وضعیت: ${currentFilter}`;
            } else {
                document.getElementById('tableTitle').textContent = 'لیست همه سفارشات';
            }

            document.getElementById('orderCountBadge').textContent = `${filtered.length} سفارش`;
            tbody.innerHTML = '';

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-gray-400">هیچ سفارشی در این وضعیت وجود ندارد.</td></tr>`;
                return;
            }

            filtered.forEach(o => {
                const statusText = (o.status || 'در حال بررسی').trim();
                let statusBadgeClass = 'bg-amber-50 text-amber-600';
                if (statusText.includes('آماده‌سازی')) statusBadgeClass = 'bg-blue-50 text-blue-600';
                if (statusText.includes('تکمیل')) statusBadgeClass = 'bg-emerald-50 text-emerald-600';

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50/85 transition';
                tr.innerHTML = `
                    <td class="p-3 font-bold text-gray-800">${o.orderId || '-'}</td>
                    <td class="p-3 text-gray-600 font-mono">${o.date || '-'}</td>
                    <td class="p-3 text-gray-600">${o.name || '-'}</td>
                    <td class="p-3 font-medium text-indigo-600">${o.city || '-'}</td>
                    <td class="p-3 max-w-xs truncate text-gray-500" title="${o.address}">${o.address || '-'}</td>
                    <td class="p-3 text-gray-400 text-[11px]">${o.product || '-'}</td>
                    <td class="p-3 text-center">
                        <span class="inline-block px-2.5 py-1 rounded-full text-[10px] font-medium ${statusBadgeClass}">
                            ${statusText}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        loadOrders();
    </script>
</body>
</html>
