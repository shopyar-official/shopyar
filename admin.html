    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec';
        const ADMIN_USER = 'admin';
        const ADMIN_PASS = '1234';
        let allOrders = [];
        let currentFilter = 'همه';
        let pendingApproveOrderId = null;

        function handleLogin(e) {
            if (e) e.preventDefault();
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value.trim();
            const errorEl = document.getElementById('loginError');

            if (username === ADMIN_USER && password === ADMIN_PASS) {
                errorEl.textContent = '';
                try {
                    localStorage.setItem('shopyar_admin_logged', 'true');
                } catch(err) {}
                showAdminPanel();
            } else {
                errorEl.textContent = 'نام کاربری یا رمز عبور اشتباه است!';
            }
            return false;
        }

        function showAdminPanel() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.body.classList.remove('flex', 'items-center', 'justify-center');
            document.getElementById('adminPanel').classList.remove('hidden');
            loadOrders();
        }

        function logout() {
            try {
                localStorage.removeItem('shopyar_admin_logged');
            } catch(e) {}
            location.reload();
        }

        function loadOrders() {
            const container = document.getElementById('ordersContainer');
            if (!container) return;
            container.innerHTML = '<div class="col-span-full text-center py-12 text-slate-400">در حال بارگذاری...</div>';

            fetch(`${SCRIPT_URL}?action=get_orders`)
                .then(res => res.json())
                .then(data => {
                    if (Array.isArray(data)) {
                        allOrders = data;
                        updateCounts();
                        renderOrders();
                    } else {
                        container.innerHTML = '<div class="col-span-full text-center py-12 text-rose-500">خطا در دریافت اطلاعات از سرور</div>';
                    }
                })
                .catch(err => {
                    console.error(err);
                    container.innerHTML = '<div class="col-span-full text-center py-12 text-rose-500">خطا در اتصال به سرور</div>';
                });
        }

        function updateCounts() {
            const counts = {
                'همه': allOrders.length,
                'منتظر تأیید': allOrders.filter(o => (o.status || 'منتظر تأیید') === 'منتظر تأیید').length,
                'در حال بررسی': allOrders.filter(o => o.status === 'در حال بررسی').length,
                'در حال آماده‌سازی': allOrders.filter(o => o.status === 'در حال آماده‌سازی').length,
                'ارسال شده': allOrders.filter(o => o.status === 'ارسال شده').length,
                'تکمیل شده': allOrders.filter(o => o.status === 'تکمیل شده').length
            };

            document.getElementById('count-all').textContent = counts['همه'];
            document.getElementById('count-waiting').textContent = counts['منتظر تأیید'];
            document.getElementById('count-pending').textContent = counts['در حال بررسی'];
            document.getElementById('count-prep').textContent = counts['در حال آماده‌سازی'];
            document.getElementById('count-sent').textContent = counts['ارسال شده'];
            document.getElementById('count-completed').textContent = counts['تکمیل شده'];
        }

        function filterOrders(status) {
            currentFilter = status;

            const cards = {
                'همه': 'card-all',
                'منتظر تأیید': 'card-waiting',
                'در حال بررسی': 'card-pending',
                'در حال آماده‌سازی': 'card-prep',
                'ارسال شده': 'card-sent',
                'تکمیل شده': 'card-completed'
            };

            for (const [key, id] of Object.entries(cards)) {
                const el = document.getElementById(id);
                if (key === status) {
                    el.className = 'cursor-pointer bg-white border-2 border-orange-500 rounded-2xl p-4 shadow-sm transition hover:shadow-md text-center';
                } else {
                    el.className = 'cursor-pointer bg-white border-2 border-transparent hover:border-slate-300 rounded-2xl p-4 shadow-sm transition hover:shadow-md text-center';
                }
            }

            renderOrders();
        }

        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            if (!container) return;
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

            let filtered = allOrders;

            if (currentFilter !== 'همه') {
                filtered = filtered.filter(o => (o.status || 'منتظر تأیید') === currentFilter);
            }

            if (searchQuery) {
                filtered = filtered.filter(o => {
                    const name = String(o.name || '').toLowerCase();
                    const phone = String(o.phone || '').toLowerCase();
                    const orderId = String(o.orderId || '').toLowerCase();
                    return name.includes(searchQuery) ||
                           phone.includes(searchQuery) ||
                           orderId.includes(searchQuery);
                });
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-slate-400 bg-white rounded-2xl border border-slate-100">هیچ سفارشی یافت نشد</div>';
                return;
            }

            container.innerHTML = '';

            filtered.forEach(order => {
                const status = order.status || 'منتظر تأیید';

                let badgeColor = 'bg-amber-50 text-amber-700 border-amber-200';
                if (status === 'منتظر تأیید') badgeColor = 'bg-rose-50 text-rose-700 border-rose-200';
                if (status === 'در حال آماده‌سازی') badgeColor = 'bg-blue-50 text-blue-700 border-blue-200';
                if (status === 'ارسال شده') badgeColor = 'bg-purple-50 text-purple-700 border-purple-200';
                if (status === 'تکمیل شده') badgeColor = 'bg-emerald-50 text-emerald-700 border-emerald-200';

                let cleanPhone = String(order.phone || '').trim();
                if (cleanPhone.startsWith('0')) {
                    cleanPhone = '98' + cleanPhone.substring(1);
                }

                const whatsappMsg = encodeURIComponent(`سلام ${order.name || ''} عزیز، بابت سفارش شما (${order.orderId}) در شاپ‌یار...`);
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl border border-slate-100 p-5 shadow-sm flex flex-col justify-between gap-4';

                // دکمه مشاهده فیش واریز
                const receiptButton = order.receiptUrl && order.receiptUrl.startsWith('http')
                    ? `<button onclick="viewReceipt('${order.receiptUrl}')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-2 px-3 rounded-lg transition flex items-center justify-center gap-1 mb-2">🧾 مشاهده فیش واریز</button>`
                    : `<div class="text-[11px] text-slate-400 text-center mb-2">فاقد تصویر فیش</div>`;

                const approveButton = status === 'منتظر تأیید'
                    ? `<button onclick="approveOrder('${order.orderId}')" class="w-full bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold py-2 px-3 rounded-lg transition shadow-sm">✅ تأیید سفارش</button>`
                    : '';

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-bold text-orange-600 bg-orange-50 px-2.5 py-1 rounded-lg">${order.orderId}</span>
                            <span class="text-xs px-2.5 py-1 rounded-lg border font-medium ${badgeColor}">${status}</span>
                        </div>
                        <h3 class="text-base font-bold text-slate-800 mb-1">${order.name || 'بدون نام'}</h3>

                        <div class="flex items-center gap-2 mb-3">
                            <a href="tel:${order.phone}" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium py-1.5 px-3 rounded-lg text-center transition flex items-center justify-center gap-1">
                                📞 تماس
                            </a>
                            <a href="https://wa.me/${cleanPhone}?text=${whatsappMsg}" target="_blank" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-medium py-1.5 px-3 rounded-lg text-center transition flex items-center justify-center gap-1">
                                💬 واتس‌اپ
                            </a>
                        </div>

                        <div class="bg-slate-50 rounded-xl p-3 text-xs space-y-1.5 text-slate-600 mb-3">
                            <div><strong class="text-slate-700">تلفن:</strong> ${order.phone || ''}</div>
                            <div><strong class="text-slate-700">شهر:</strong> ${order.city || ''}</div>
                            <div><strong class="text-slate-700">آدرس:</strong> ${order.address || ''}</div>
                            <div><strong class="text-slate-700">خرید:</strong> ${order.product || ''}</div>
                        </div>

                        ${receiptButton}
                        ${approveButton}
                    </div>

                    <div class="flex items-center justify-between pt-3 border-t border-slate-100 gap-2">
                        <span class="text-[11px] text-slate-400">${order.date || ''}</span>
                        <select onchange="updateStatus('${order.orderId}', this.value)" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium text-slate-700">
                            <option value="" disabled selected>تغییر وضعیت...</option>
                            <option value="منتظر تأیید">منتظر تأیید</option>
                            <option value="در حال بررسی">در حال بررسی</option>
                            <option value="در حال آماده‌سازی">در حال آماده‌سازی</option>
                            <option value="ارسال شده">ارسال شده</option>
                            <option value="تکمیل شده">تکمیل شده</option>
                        </select>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // مشاهده فیش واریز
        function viewReceipt(url) {
            document.getElementById('receiptModalImg').src = url;
            document.getElementById('receiptModalLink').href = url;
            const modal = document.getElementById('receiptModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeReceiptModal() {
            const modal = document.getElementById('receiptModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // باز کردن مودال تأیید
        function approveOrder(orderId) {
            pendingApproveOrderId = orderId;
            const modal = document.getElementById('confirmModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        // بستن مودال تأیید
        function closeConfirmModal() {
            pendingApproveOrderId = null;
            const modal = document.getElementById('confirmModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // ارسال تأیید سفارش به سرور
        function confirmApproveOrder() {
            if (pendingApproveOrderId === null) return;

            const orderId = pendingApproveOrderId;
            const button = document.getElementById('confirmModalBtn');
            button.disabled = true;
            button.textContent = 'در حال ثبت...';

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'approve_order',
                    orderId: orderId
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    const order = allOrders.find(o => String(o.orderId) === String(orderId));
                    if (order) order.status = 'در حال بررسی';

                    closeConfirmModal();
                    updateCounts();
                    renderOrders();
                } else {
                    alert(data.message || 'خطا در تأیید سفارش');
                }
            })
            .catch(err => {
                console.error(err);
                alert('خطا در اتصال به سرور');
            })
            .finally(() => {
                button.disabled = false;
                button.textContent = 'تأیید و انتقال';
            });
        }

        function updateStatus(orderId, newStatus) {
            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'update_status',
                    orderId: orderId,
                    status: newStatus
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    const order = allOrders.find(o => String(o.orderId) === String(orderId));
                    if (order) order.status = newStatus;
                    updateCounts();
                    renderOrders();
                } else {
                    alert(data.message || 'خطا در به‌روزرسانی وضعیت');
                }
            })
            .catch(err => {
                console.error(err);
                alert('خطا در اتصال به سرور');
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const confirmBtn = document.getElementById('confirmModalBtn');
            if (confirmBtn) {
                confirmBtn.addEventListener('click', confirmApproveOrder);
            }

            try {
                if (localStorage.getItem('shopyar_admin_logged') === 'true') {
                    showAdminPanel();
                }
            } catch(e) {}
        });
    </script>
