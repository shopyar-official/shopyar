<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت شاپ‌یار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- هدر پنل -->
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-md shadow-indigo-200">ش</div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900">پنل مدیریت شاپ‌یار</h1>
                    <p class="text-xs text-slate-500">مدیریت هوشمند سفارشات فروشگاه</p>
                </div>
            </div>
            <button onclick="fetchOrders()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2">
                🔄 بروزرسانی سفارش‌ها
            </button>
        </div>
    </header>

    <!-- محتوای اصلی -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- آمار کلی -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center font-bold text-xl">📦</div>
                <div>
                    <p class="text-xs text-slate-500">کل سفارش‌ها</p>
                    <h3 id="total-orders-count" class="text-xl font-bold text-slate-800">۰</h3>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center font-bold text-xl">⏳</div>
                <div>
                    <p class="text-xs text-slate-500">در انتظار بررسی</p>
                    <h3 id="pending-orders-count" class="text-xl font-bold text-slate-800">۰</h3>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center font-bold text-xl">✅</div>
                <div>
                    <p class="text-xs text-slate-500">تکمیل شده</p>
                    <h3 id="completed-orders-count" class="text-xl font-bold text-slate-800">۰</h3>
                </div>
            </div>
        </div>

        <!-- لیست سفارشات -->
        <div class="mb-4 flex justify-between items-center">
            <h2 class="font-bold text-lg text-slate-800">فهرست سفارش‌های ثبت شده</h2>
            <span id="last-update" class="text-xs text-slate-400"></span>
        </div>

        <div id="loading" class="text-center py-16 bg-white rounded-2xl shadow-sm border border-slate-100">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent mb-3"></div>
            <p class="text-slate-500 text-sm">در حال بارگذاری سفارش‌ها از سرور...</p>
        </div>

        <div id="error-box" class="hidden text-center py-12 bg-rose-50 rounded-2xl border border-rose-100 text-rose-600 p-6">
            <p class="font-bold mb-2">خطا در دریافت اطلاعات!</p>
            <p id="error-message" class="text-sm mb-4"></p>
            <button onclick="fetchOrders()" class="bg-rose-600 text-white px-4 py-2 rounded-xl text-sm font-bold">تلاش مجدد</button>
        </div>

        <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- کارت‌ها اینجا به صورت پویا اضافه می‌شوند -->
        </div>

    </main>

    <script>
        // آدرس وب اپلیکیشن گوگل اسکریپت شما
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec';

        async function fetchOrders() {
            const loading = document.getElementById('loading');
            const errorBox = document.getElementById('error-box');
            const ordersGrid = document.getElementById('orders-grid');
            
            loading.classList.remove('hidden');
            errorBox.classList.add('hidden');
            ordersGrid.innerHTML = '';

            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();

                loading.classList.add('hidden');

                if (data.status === 'success' && data.orders) {
                    renderOrders(data.orders);
                } else {
                    throw new Error(data.message || 'خطا در ساختار داده‌ها');
                }
            } catch (error) {
                loading.classList.add('hidden');
                errorBox.classList.remove('hidden');
                document.getElementById('error-message').innerText = error.toString();
            }
        }

        function renderOrders(orders) {
            const ordersGrid = document.getElementById('orders-grid');
            
            // به‌روزرسانی آمار
            document.getElementById('total-orders-count').innerText = orders.length;
            document.getElementById('pending-orders-count').innerText = orders.filter(o => o.status === 'در انتظار بررسی' || !o.status).length;
            document.getElementById('completed-orders-count').innerText = orders.filter(o => o.status === 'ارسال شده' || o.status === 'تکمیل شده').length;
            document.getElementById('last-update').innerText = 'آخرین بروزرسانی: ' + new Date().toLocaleTimeString('fa-IR');

            if (orders.length === 0) {
                ordersGrid.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-white rounded-2xl shadow-sm border border-slate-100">
                        <p class="text-slate-400 font-medium">هنوز سفارشی ثبت نشده است.</p>
                    </div>
                `;
                return;
            }

            ordersGrid.innerHTML = '';

            orders.forEach((order, index) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex flex-col justify-between transition hover:shadow-md";
                
                const cleanPhone = order.phone ? order.phone.replace(/^0/, '') : '';
                const shippingCostNum = Number(order.shippingCost || 0);
                const totalAmountNum = Number(order.totalAmount || 0);

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-4 pb-3 border-b border-slate-100">
                            <span class="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full">سفارش #${orders.length - index}</span>
                            <span class="text-slate-400 text-xs">${order.date || 'ثبت شده'}</span>
                        </div>
                        <div class="space-y-2.5 text-sm">
                            <div class="flex justify-between">
                                <span class="text-slate-500">نام مشتری:</span>
                                <span class="font-bold text-slate-800">${order.name || '-'}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-500">شماره تماس:</span>
                                <a href="tel:${order.phone}" class="font-bold text-indigo-600 hover:underline" dir="ltr">${order.phone || '-'}</a>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-500">محصول:</span>
                                <span class="font-bold text-slate-800">${order.product || '-'}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-500">تعداد:</span>
                                <span class="font-bold text-slate-800">${order.quantity || '1'}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-500">شهر / آدرس:</span>
                                <span class="text-slate-700 text-left max-w-[180px] truncate" title="${order.address}">${order.city || ''} - ${order.address || '-'}</span>
                            </div>
                            <div class="flex justify-between border-t border-slate-50 pt-2">
                                <span class="text-slate-500">روش ارسال:</span>
                                <span class="font-medium text-slate-700">${order.shippingMethod || 'پیشتاز'} (${shippingCostNum.toLocaleString()} ت)</span>
                            </div>
                            <div class="flex justify-between font-bold text-indigo-600 pt-1">
                                <span>مبلغ کل:</span>
                                <span>${totalAmountNum.toLocaleString()} تومان</span>
                            </div>
                        </div>
                    </div>
                    <div class="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center">
                        <span class="bg-amber-50 text-amber-700 px-2.5 py-1 rounded-lg text-xs font-bold">⏳ ${order.status || 'در انتظار بررسی'}</span>
                        <a href="https://wa.me/98${cleanPhone}" target="_blank" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                            💬 واتساپ مشتری
                        </a>
                    </div>
                `;
                ordersGrid.appendChild(card);
            });
        }

        // بارگذاری اولیه هنگام باز شدن صفحه
        fetchOrders();
console.log("Shopyar Admin v2 Loaded"); // این خط جدید کش را می‌پراند
    </script>
</body>
</html>
