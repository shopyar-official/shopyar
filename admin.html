<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت سفارشات - شاپ یار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-12">

    <!-- هدر پنل -->
    <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3 flex justify-between items-center border-b">
        <div class="flex items-center gap-3">
            <div class="bg-orange-500 text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold text-lg shadow-md">ش</div>
            <div>
                <h1 class="font-bold text-gray-800 text-base">مدیریت سفارشات شاپ‌یار</h1>
                <p class="text-xs text-gray-500">پنل اختصاصی فروشگاه شما</p>
            </div>
        </div>
        <button onclick="loadOrders()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-3 py-2 rounded-lg flex items-center gap-1 transition">
            🔄 بروزرسانی
        </button>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <!-- دکمه‌های فیلتر وضعیت -->
        <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
            <button onclick="filterOrders('همه', this)" class="filter-btn bg-orange-500 text-white px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap shadow-sm transition">همه</button>
            <button onclick="filterOrders('در حال بررسی', this)" class="filter-btn bg-white text-gray-600 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap border transition">در حال بررسی</button>
            <button onclick="filterOrders('در حال آماده‌سازی', this)" class="filter-btn bg-white text-gray-600 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap border transition">در حال آماده‌سازی</button>
            <button onclick="filterOrders('ارسال شده', this)" class="filter-btn bg-white text-gray-600 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap border transition">ارسال شده</button>
            <button onclick="filterOrders('تکمیل شده', this)" class="filter-btn bg-white text-gray-600 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap border transition">تکمیل شده</button>
        </div>

        <!-- لیست سفارشات -->
        <div id="orders-container" class="space-y-3">
            <div class="text-center py-10 text-gray-400 text-sm">در حال بارگذاری سفارش‌ها...</div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec";
        let allOrders = [];

        async function loadOrders() {
            const container = document.getElementById('orders-container');
            container.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm">در حال دریافت اطلاعات...</div>';
            
            try {
                const response = await fetch(`${SCRIPT_URL}?action=get_orders`);
                const data = await response.json();
                allOrders = data;
                renderOrders(allOrders);
            } catch (error) {
                container.innerHTML = '<div class="text-center py-10 text-red-500 text-sm">خطا در دریافت اطلاعات از سرور!</div>';
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('orders-container');
            if (!orders || orders.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm">هیچ سفارشی ثبت نشده است.</div>';
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-md font-mono">${order.orderId || '---'}</span>
                            <h3 class="font-bold text-gray-800 mt-2 text-base">${order.name || 'بدون نام'}</h3>
                        </div>
                        <select onchange="updateStatus('${order.orderId}', this.value)" class="text-xs bg-gray-50 border border-gray-200 rounded-lg px-2 py-1.5 focus:outline-none focus:border-orange-500 font-medium">
                            <option value="در حال بررسی" ${order.status === 'در حال بررسی' ? 'selected' : ''}>در حال بررسی</option>
                            <option value="در حال آماده‌سازی" ${order.status === 'در حال آماده‌سازی' ? 'selected' : ''}>در حال آماده‌سازی</option>
                            <option value="ارسال شده" ${order.status === 'ارسال شده' ? 'selected' : ''}>ارسال شده</option>
                            <option value="تکمیل شده" ${order.status === 'تکمیل شده' ? 'selected' : ''}>تکمیل شده</option>
                        </select>
                    </div>

                    <div class="text-xs text-gray-600 space-y-1.5 bg-gray-50 p-2.5 rounded-xl">
                        <div>📞 تلفن: <span class="font-medium text-gray-800">${order.phone || '---'}</span></div>
                        <div>🏙️ شهر: <span class="font-medium text-gray-800">${order.city || '---'}</span></div>
                        <div>📦 محصول: <span class="font-medium text-gray-800">${order.product || '---'}</span></div>
                        <div>📍 آدرس: <span class="font-medium text-gray-800">${order.address || '---'}</span></div>
                    </div>

                    <div class="text-[11px] text-gray-400 pt-1 border-t border-gray-100 flex justify-between">
                        <span>تاریخ ثبت:</span>
                        <span>${order.date || '---'}</span>
                    </div>
                </div>
            `).join('');
        }

        function filterOrders(status, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('bg-orange-500', 'text-white', 'shadow-sm');
                b.classList.add('bg-white', 'text-gray-600', 'border');
            });
            btn.classList.remove('bg-white', 'text-gray-600', 'border');
            btn.classList.add('bg-orange-500', 'text-white', 'shadow-sm');

            if (status === 'همه') {
                renderOrders(allOrders);
            } else {
                const filtered = allOrders.filter(o => o.status === status);
                renderOrders(filtered);
            }
        }

        async function updateStatus(orderId, newStatus) {
            try {
                const formData = new URLSearchParams();
                formData.append('action', 'update_status');
                formData.append('orderId', orderId);
                formData.append('status', newStatus);

                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                
                // به‌روزرسانی محلی مقدار وضعیت در آرایه
                const order = allOrders.find(o => o.orderId === orderId);
                if (order) order.status = newStatus;
            } catch (error) {
                alert('خطا در به‌روزرسانی وضعیت!');
            }
        }

        // بارگذاری اولیه هنگام ورود به صفحه
        loadOrders();
    </script>
</body>
</html>
