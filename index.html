<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>شاپ‌یار | ثبت سفارش</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 16px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, #fff7ed, #f1f5f9);
      font-family: Tahoma, sans-serif; color: #1e293b;
    }
    .card {
      width: 100%; max-width: 460px; padding: 28px 24px;
      background: white; border: 1px solid #e2e8f0;
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, .09);
    }
    .logo {
      display: grid; place-items: center; width: 64px;
      height: 64px; margin: 0 auto 15px; border-radius: 19px;
      background: #f59e0b; font-size: 30px;
    }
    h1 { text-align: center; font-size: 23px; margin: 0 0 8px; }
    .subtitle {
      text-align: center; color: #64748b; font-size: 13px;
      line-height: 1.9; margin: 0 0 25px;
    }
    label {
      display: block; font-size: 13px; font-weight: bold;
      margin: 16px 0 7px;
    }
    input, textarea {
      display: block; width: 100%; padding: 13px 14px;
      border: 1px solid #cbd5e1; border-radius: 12px;
      background: #f8fafc; font: inherit; font-size: 14px;
      outline: none;
    }
    input:focus, textarea:focus { border-color: #f59e0b; }
    textarea { min-height: 85px; resize: vertical; }
    button {
      width: 100%; padding: 15px; margin-top: 24px;
      border: 0; border-radius: 13px; background: #f59e0b;
      color: #172033; font: inherit; font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .hint {
      text-align: center; color: #64748b; font-size: 11px;
      line-height: 1.8; margin: 16px 0 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🛍️</div>
    <h1>ثبت سفارش سریع</h1>
    <p class="subtitle">مشخصاتتان را وارد کنید تا سفارش شما ثبت شود.</p>

    <form id="orderForm"
      action="https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec"
      method="post"
      target="_self">

      <label for="name">نام و نام خانوادگی</label>
      <input id="name" name="name" type="text" required maxlength="100"
        autocomplete="name" placeholder="مثلاً علی نوری">

      <label for="phone">شماره تماس</label>
      <input id="phone" name="phone" type="tel" required maxlength="20"
        autocomplete="tel" placeholder="مثلاً 09123456789" dir="ltr">

      <label for="city">شهر</label>
      <input id="city" name="city" type="text" required maxlength="100"
        placeholder="مثلاً تهران">

      <label for="address">آدرس کامل</label>
      <textarea id="address" name="address" required maxlength="500"
        placeholder="خیابان، کوچه، پلاک، واحد..."></textarea>

      <label for="product">محصول یا توضیحات سفارش</label>
      <input id="product" name="product" type="text" required maxlength="200"
        placeholder="مثلاً هودی مشکی سایز L">

      <button id="submitBtn" type="submit">ثبت سفارش</button>
      <p class="hint">پس از ثبت، نتیجهٔ سفارش در همین صفحه نمایش داده می‌شود.</p>
    </form>
  </main>

  <script>
    const form = document.getElementById('orderForm');
    const button = document.getElementById('submitBtn');

    // هنگام بازگشت با دکمهٔ مرورگر، فرم سفارش قبلی باقی نماند.
    window.addEventListener('pageshow', function () {
      form.reset();
      button.disabled = false;
      button.textContent = 'ثبت سفارش';
    });

    form.addEventListener('submit', function () {
      button.disabled = true;
      button.textContent = 'در حال ارسال...';
    });
  </script>
</body>
</html>
