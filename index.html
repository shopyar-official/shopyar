<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت سفارش - شاپ‌یار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-sm border border-slate-100 p-6 md:p-8">
        
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-slate-800">🛍️ ثبت سفارش در شاپ‌یار</h1>
            <p class="text-xs text-slate-500 mt-1">لطفاً مشخصات و اطلاعات پرداخت خود را وارد کنید</p>
        </div>

        <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
            
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">نام و نام خانوادگی <span class="text-rose-500">*</span></label>
                <input type="text" id="name" required class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">شماره موبایل <span class="text-rose-500">*</span></label>
                <input type="tel" id="phone" required class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium" placeholder="09123456789">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">شهر <span class="text-rose-500">*</span></label>
                <input type="text" id="city" required class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">آدرس پستی کامل <span class="text-rose-500">*</span></label>
                <textarea id="address" required rows="2" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium"></textarea>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">انتخاب محصول <span class="text-rose-500">*</span></label>
                <select id="productSelect" onchange="updateTotal()" required class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium text-slate-700">
                    <option value="" disabled selected>در حال بارگذاری محصولات...</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">تعداد <span class="text-rose-500">*</span></label>
                <input type="number" id="quantity" min="1" value="1" onchange="updateTotal()" required class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium text-slate-700">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">نوع ارسال <span class="text-rose-500">*</span></label>
                <select id="shippingSelect" onchange="updateTotal()" required class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium text-slate-700">
                    <option value="0" selected>انتخاب نوع ارسال...</option>
                    <option value="50000">پست پیشتاز (۵۰,۰۰۰ تومان)</option>
                    <option value="80000">تیپاکس (۸۰,۰۰۰ تومان)</option>
                    <option value="30000">پیک موتوری (۳۰,۰۰۰ تومان)</option>
                </select>
            </div>

            <!-- فیلد شماره پیگیری / فیش (کاملاً اجباری) -->
            <div class="bg-rose-50/50 border border-rose-100 p-3 rounded-2xl">
                <label class="block text-xs font-bold text-slate-800 mb-1">شماره فیش واریزی / کد پیگیری تراکنش <span class="text-rose-500">* (الزامی)</span></label>
                <p class="text-[10px] text-slate-500 mb-2">تا زمانی که شماره فیش را وارد نکنید، سفارش ثبت نخواهد شد.</p>
                <input type="text" id="receipt" required placeholder="مثلاً: 123456 یا کد ارجاع بانکی" class="w-full text-xs bg-white border border-rose-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium">
            </div>

            <div class="bg-orange-50 border border-orange-200 rounded-2xl p-4 text-slate-700 space-y-1 text-xs">
                <div class="flex justify-between">
                    <span>قیمت کل محصولات:</span>
                    <span id="productPriceText">۰ تومان</span>
                </div>
                <div class="flex justify-between">
                    <span>هزینه ارسال:</span>
                    <span id="shippingPriceText">۰ تومان</span>
                </div>
                <div class="border-t border-orange-200 pt-2 flex justify-between font-bold text-sm text-orange-800">
                    <span>مبلغ کل قابل پرداخت:</span>
                    <span id="totalPriceText">۰ تومان</span>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-xl text-xs transition shadow-sm">
                ثبت نهایی سفارش
            </button>
        </form>

        <div id="responseMessage" class="mt-4 text-center text-xs"></div>

    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec';
        let productsData = [];

        window.addEventListener('DOMContentLoaded', () => {
            fetchProducts();
        });

        function fetchProducts() {
            fetch(`${SCRIPT_URL}?action=get_products`)
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById('productSelect');
                    select.innerHTML = '<option value="" disabled selected>انتخاب محصول...</option>';
                    if(Array.isArray(data) && data.length > 0) {
                        productsData = data;
                        data.forEach((p, index) => {
                            const opt = document.createElement('option');
                            opt.value = index;
                            opt.textContent = `${p.name} - ${Number(p.price || 0).toLocaleString()} تومان`;
                            select.appendChild(opt);
                        });
                    } else {
                        select.innerHTML = '<option value="" disabled>محصولی یافت نشد</option>';
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('productSelect').innerHTML = '<option value="" disabled>خطا در بارگذاری محصولات</option>';
                });
        }

        function updateTotal() {
            const productIndex = document.getElementById('productSelect').value;
            const quantity = Number(document.getElementById('quantity').value) || 1;
            const shippingVal = Number(document.getElementById('shippingSelect').value) || 0;
            
            let unitPrice = 0;
            if(productIndex !== "" && productsData[productIndex]) {
                unitPrice = Number(productsData[productIndex].price || 0);
            }

            const productTotalPrice = unitPrice * quantity;
            const total = productTotalPrice + shippingVal;

            document.getElementById('productPriceText').textContent = productTotalPrice.toLocaleString() + ' تومان';
            document.getElementById('shippingPriceText').textContent = shippingVal.toLocaleString() + ' تومان';
            document.getElementById('totalPriceText').textContent = total.toLocaleString() + ' تومان';
        }

        function submitOrder(e) {
            e.preventDefault();
            
            const receiptVal = document.getElementById('receipt').value.trim();
            if (!receiptVal) {
                alert('لطفاً شماره فیش واریزی یا کد پیگیری را وارد کنید.');
                document.getElementById('receipt').focus();
                return;
            }

            const btn = document.getElementById('submitBtn');
            const resp = document.getElementById('responseMessage');
            
            btn.disabled = true;
            btn.textContent = 'در حال ثبت سفارش...';
            resp.innerHTML = '';

            const productIndex = document.getElementById('productSelect').value;
            const selectedProduct = productsData[productIndex] ? productsData[productIndex].name : '';
            const quantity = document.getElementById('quantity').value;
            const shippingText = document.getElementById('shippingSelect').selectedOptions[0].text;
            const unitPrice = productsData[productIndex] ? Number(productsData[productIndex].price || 0) : 0;
            const shippingVal = Number(document.getElementById('shippingSelect').value) || 0;
            const totalAmount = (unitPrice * Number(quantity)) + shippingVal;

            const fullProductDetails = `${selectedProduct} (تعداد: ${quantity}) | ارسال: ${shippingText} | مبلغ کل: ${totalAmount.toLocaleString()} تومان`;

            const formData = new URLSearchParams({
                action: 'add_order',
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                city: document.getElementById('city').value,
                address: document.getElementById('address').value,
                product: fullProductDetails,
                receipt: receiptVal
            });

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    resp.innerHTML = `<div class="bg-emerald-50 border border-emerald-200 text-emerald-700 p-3 rounded-xl font-bold">سفارش شما با موفقیت ثبت شد!<br>کد پیگیری سفارش: ${data.orderId}</div>`;
                    document.getElementById('orderForm').reset();
                    document.getElementById('quantity').value = '1';
                    document.getElementById('productPriceText').textContent = '۰ تومان';
                    document.getElementById('shippingPriceText').textContent = '۰ تومان';
                    document.getElementById('totalPriceText').textContent = '۰ تومان';
                } else {
                    resp.innerHTML = '<span class="text-rose-500">خطا در ثبت سفارش. لطفاً دوباره تلاش کنید.</span>';
                }
                btn.disabled = false;
                btn.textContent = 'ثبت نهایی سفارش';
            })
            .catch(err => {
                console.error(err);
                resp.innerHTML = '<span class="text-rose-500">خطا در اتصال به سرور.</span>';
                btn.disabled = false;
                btn.textContent = 'ثبت نهایی سفارش';
            });
        }
    </script>
</body>
</html>
