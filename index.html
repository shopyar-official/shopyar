<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت سفارش سریع - شاپ‌یار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-6 md:p-8 border border-slate-100">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">🛍️ شاپ‌یار</h1>
            <p class="text-sm text-slate-500 mt-1">لطفاً اطلاعات سفارش خود را وارد کنید</p>
        </div>

        <form id="orderForm" class="space-y-4">
            <!-- نام مشتری -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">نام و نام خانوادگی</label>
                <input type="text" id="name" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:outline-none text-sm bg-slate-50">
            </div>

            <!-- شماره تلفن -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">شماره تماس</label>
                <input type="tel" id="phone" required placeholder="09123456789" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:outline-none text-sm bg-slate-50 text-left" dir="ltr">
            </div>

            <!-- شهر -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">شهر</label>
                <input type="text" id="city" required placeholder="مثلا: تهران" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:outline-none text-sm bg-slate-50">
            </div>

            <!-- آدرس پستی -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">آدرس کامل پستی</label>
                <textarea id="address" rows="3" required placeholder="استان، شهر، خیابان، پلاک، واحد" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:outline-none text-sm bg-slate-50"></textarea>
            </div>

            <!-- انتخاب محصول -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">انتخاب محصول</label>
                <select id="product" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:outline-none text-sm bg-slate-50">
                    <option value="">در حال بارگذاری محصولات...</option>
                </select>
            </div>

            <!-- دکمه ثبت -->
            <button type="submit" id="submitBtn" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-orange-600/20 text-sm">
                ثبت نهایی سفارش
            </button>
        </form>

        <div id="resultMessage" class="hidden mt-4 p-3 rounded-xl text-center text-sm font-medium"></div>
    </div>

    <script>
        // 🚨 آدرس Web App گوگل اسکریپت خود را اینجا قرار دهید:
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec';

        // بارگذاری خودکار محصولات از گوگل شیت
        window.addEventListener('DOMContentLoaded', () => {
            fetch(`${SCRIPT_URL}?action=get_products`)
                .then(res => res.json())
                .then(data => {
                    const productSelect = document.getElementById('product');
                    productSelect.innerHTML = '<option value="">انتخاب محصول...</option>';
                    if(data && data.length > 0) {
                        data.forEach(item => {
                            let opt = document.createElement('option');
                            opt.value = item.name + (item.price ? ` (${item.price} تومان)` : '');
                            opt.textContent = item.name + (item.price ? ` - ${item.price} تومان` : '');
                            productSelect.appendChild(opt);
                        });
                    }
                })
                .catch(err => {
                    console.error('خطا در دریافت محصولات:', err);
                    document.getElementById('product').innerHTML = '<option value="">خطا در بارگذاری محصولات</option>';
                });
        });

        // ارسال فرم سفارش به گوگل شیت
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('resultMessage');
            
            btn.disabled = true;
            btn.textContent = 'در حال ثبت سفارش...';
            msgBox.className = 'hidden mt-4 p-3 rounded-xl text-center text-sm font-medium';

            const formData = new URLSearchParams({
                name: document.getElementById('name').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                city: document.getElementById('city').value.trim(),
                address: document.getElementById('address').value.trim(),
                product: document.getElementById('product').value.trim()
            });

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    msgBox.textContent = `✅ سفارش شما با موفقیت ثبت شد! کد پیگیری: ${data.orderId}`;
                    msgBox.className = 'mt-4 p-3 rounded-xl text-center text-sm font-medium bg-emerald-50 text-emerald-700 border border-emerald-100';
                    document.getElementById('orderForm').reset();
                } else {
                    throw new Error(data.message || 'خطای ناشناخته');
                }
            })
            .catch(err => {
                msgBox.textContent = '❌ خطا در ثبت سفارش. لطفاً دوباره تلاش کنید.';
                msgBox.className = 'mt-4 p-3 rounded-xl text-center text-sm font-medium bg-rose-50 text-rose-700 border border-rose-100';
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = 'ثبت نهایی سفارش';
            });
        });
    </script>
</body>
</html>
