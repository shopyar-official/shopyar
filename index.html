<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاپ‌یار | ثبت سفارش کالا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn FD', sans-serif; }
    </style>
</head>

<body class="bg-slate-100 min-h-screen py-8 px-4 flex items-center justify-center">
    <div class="bg-white max-w-md w-full rounded-2xl shadow-xl p-6 border border-slate-200">

        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-amber-500 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-bold mb-3 shadow-md">
                🛒
            </div>
            <h1 class="text-xl font-black text-slate-800">فرم ثبت سفارش سریع</h1>
            <p class="text-xs text-slate-500 mt-1">
                مشخصات خودتون رو برای ارسال سفارش وارد کنید
            </p>
        </div>

        <form
            action="https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec"
            method="post"
            target="_blank"
            class="space-y-4"
        >
            <div>
                <label for="name" class="block text-xs font-bold text-slate-700 mb-1">
                    نام و نام خانوادگی:
                </label>
                <input id="name" name="name" type="text" required
                    placeholder="مثلاً: علی نوری"
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>

            <div>
                <label for="phone" class="block text-xs font-bold text-slate-700 mb-1">
                    شماره تماس:
                </label>
                <input id="phone" name="phone" type="tel" required
                    placeholder="0912xxxxxxx" dir="ltr"
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm text-right focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>

            <div>
                <label for="city" class="block text-xs font-bold text-slate-700 mb-1">
                    شهر:
                </label>
                <input id="city" name="city" type="text" required
                    placeholder="مثلاً: تهران"
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>

            <div>
                <label for="address" class="block text-xs font-bold text-slate-700 mb-1">
                    آدرس کامل:
                </label>
                <textarea id="address" name="address" rows="3" required
                    placeholder="خیابان، کوچه، پلاک، واحد..."
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
            </div>

            <div>
                <label for="product" class="block text-xs font-bold text-slate-700 mb-1">
                    نام محصول یا توضیحات سفارش:
                </label>
                <input id="product" name="product" type="text" required
                    placeholder="مثلاً: هودی مشکی سایز L"
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>

            <button type="submit"
                class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-amber-500/30">
                ارسال سفارش
            </button>

            <p class="text-xs text-slate-500 text-center leading-6">
                نتیجهٔ ارسال در صفحهٔ جدید باز می‌شود. ثبت سفارش را در گوگل‌شیت بررسی کنید.
            </p>
        </form>
    </div>
</body>
</html>
