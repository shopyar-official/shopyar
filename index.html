<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>شاپ‌یار | ثبت سفارش</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f7fb;color:#263248;font-family:Tahoma,Arial}
    main{max-width:580px;margin:25px auto;padding:0 15px 35px}
    header{text-align:center;margin-bottom:20px}
    h1{margin-bottom:6px}
    .card{background:#fff;border-radius:18px;padding:22px;margin:12px 0;
      box-shadow:0 10px 30px #182b4210}
    label{display:block;font-weight:bold;margin:15px 0 7px}
    input,select,textarea,button{font:inherit}
    input,select,textarea{width:100%;padding:12px;border:1px solid #cdd5e1;
      border-radius:10px;background:#fff}
    textarea{min-height:85px;resize:vertical}
    input:focus,select:focus,textarea:focus{outline:2px solid #ffd0b8}
    button,.link{border:0;background:#e66017;color:#fff;border-radius:10px;
      padding:12px 17px;text-decoration:none;cursor:pointer;font-weight:bold}
    button{width:100%;margin-top:20px}
    button:disabled{opacity:.6}
    .link{display:inline-block;background:#263248}
    .muted{color:#687586;font-size:13px;line-height:1.9}
    .product{display:flex;gap:12px;align-items:center;padding:12px;
      border:1px solid #e4e9f0;border-radius:12px;margin:10px 0}
    .product img{width:70px;height:70px;object-fit:cover;border-radius:8px}
    .product input{width:auto}
    .product label{margin:0;font-weight:normal;flex:1;cursor:pointer}
    .product b{display:block}
    #catalogError{color:#a82828}
  </style>
</head>
<body>
<main>
  <header>
    <h1>🛍️ شاپ‌یار</h1>
    <p class="muted">سفارش خود را سریع و ساده ثبت کنید.</p>
    <a class="link"
       href="https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec?page=track">
      پیگیری سفارش
    </a>
  </header>

  <form id="orderForm" class="card"
    action="https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec"
    method="post" accept-charset="UTF-8">

    <h2>ثبت سفارش</h2>

    <label for="name">نام و نام خانوادگی</label>
    <input id="name" name="name" maxlength="100" required>

    <label for="phone">شماره موبایل</label>
    <input id="phone" name="phone" type="text" inputmode="numeric"
      maxlength="11" pattern="09[0-9]{9}" placeholder="09123456789" required>

    <label for="city">شهر</label>
    <input id="city" name="city" maxlength="80" required>

    <label for="address">آدرس کامل</label>
    <textarea id="address" name="address" maxlength="350" required></textarea>

    <label>محصول</label>
    <div id="products"><p class="muted">در حال بارگذاری محصولات...</p></div>
    <p id="catalogError" hidden></p>

    <label for="quantity">تعداد</label>
    <input id="quantity" name="quantity" type="number"
      min="1" max="99" value="1" required>

    <label for="postalCode">کد پستی ۱۰ رقمی</label>
    <input id="postalCode" name="postalCode" type="text"
      inputmode="numeric" maxlength="10" pattern="[0-9]{10}" required>

    <label for="shippingMethod">روش ارسال</label>
    <select id="shippingMethod" name="shippingMethod" required>
      <option value="">روش ارسال را انتخاب کنید</option>
      <option value="پست پیشتاز">پست پیشتاز</option>
      <option value="تیپاکس">تیپاکس</option>
      <option value="پست سفارشی">پست سفارشی</option>
      <option value="پیک شهری">پیک شهری</option>
      <option value="تحویل حضوری">تحویل حضوری</option>
    </select>

    <label for="couponCode">کد تخفیف، اگر دارید</label>
    <input id="couponCode" name="couponCode" maxlength="40">

    <p id="summary" class="muted">
      پس از انتخاب محصول و روش ارسال، هزینهٔ قابل محاسبه نمایش داده می‌شود.
    </p>
    <p class="muted">
      کد تخفیف هنگام ثبت سفارش در سرور بررسی می‌شود؛ مبلغ قطعی
      در رسید سفارش نمایش داده خواهد شد.
    </p>

    <button id="submitButton" type="submit">ثبت سفارش</button>
  </form>
</main>

<script>
  const APP =
    'https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec';

  let catalog = {products: [], shipping: []};
  let catalogLoaded = false;

  const productsBox = document.getElementById('products');
  const city = document.getElementById('city');
  const method = document.getElementById('shippingMethod');
  const quantity = document.getElementById('quantity');
  const summary = document.getElementById('summary');

  function formatMoney(value) {
    return Number(value).toLocaleString('fa-IR') + ' تومان';
  }

  function manualProduct() {
    productsBox.replaceChildren();
    const input = document.createElement('input');
    input.name = 'product';
    input.id = 'product';
    input.required = true;
    input.maxLength = 160;
    input.placeholder = 'نام محصول موردنظر را بنویسید';
    productsBox.append(input);
  }

  window.shopyarCatalog = function (data) {
    catalogLoaded = true;
    clearTimeout(catalogTimer);

    catalog = data || {products: [], shipping: []};
    productsBox.replaceChildren();

    if (!catalog.products || !catalog.products.length) {
      manualProduct();
      updateSummary();
      return;
    }

    catalog.products.forEach((p, index) => {
      const row = document.createElement('div');
      row.className = 'product';

      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'product';
      radio.value = p.name;
      radio.required = true;
      radio.id = 'p' + index;
      radio.addEventListener('change', updateSummary);

      if (p.image && /^https:\/\//i.test(p.image)) {
        const img = document.createElement('img');
        img.src = p.image;
        img.alt = p.name;
        img.loading = 'lazy';
        row.append(img);
      }

      const label = document.createElement('label');
      label.htmlFor = radio.id;
      const title = document.createElement('b');
      title.textContent = p.name;
      label.append(title);

      const price = document.createElement('small');
      price.textContent = p.price === null
        ? 'قیمت با فروشگاه هماهنگ می‌شود'
        : formatMoney(p.price);
      label.append(price);

      row.append(radio, label);
      productsBox.append(row);
    });

    updateSummary();
  };

  const catalogTimer = setTimeout(() => {
    if (!catalogLoaded) {
      const error = document.getElementById('catalogError');
      error.textContent =
        'فهرست محصولات بارگذاری نشد؛ صفحه را تازه‌سازی کنید.';
      error.hidden = false;
      productsBox.textContent = '';
      document.getElementById('submitButton').disabled = true;
    }
  }, 12000);

  const script = document.createElement('script');
  script.src = APP + '?mode=catalog';
  script.onerror = () => {
    const error = document.getElementById('catalogError');
    error.textContent =
      'ارتباط با فهرست محصولات برقرار نشد؛ دوباره تلاش کنید.';
    error.hidden = false;
    document.getElementById('submitButton').disabled = true;
  };
  document.body.append(script);

  function updateSummary() {
    const selected = document.querySelector(
      'input[name="product"]:checked'
    );
    const product = selected
      ? catalog.products.find(p => p.name === selected.value)
      : null;

    const place = city.value.trim();
    const shippingMethod = method.value;
    const rates = catalog.shipping || [];

    const rate = rates.find(x =>
      x.city === place && x.method === shippingMethod
    ) || rates.find(x =>
      x.city === '*' && x.method === shippingMethod
    );

    const productPrice = product && product.price !== null
      ? product.price * Number(quantity.value || 1)
      : null;

    const shippingPrice = rate ? rate.price : null;

    if (productPrice === null || shippingPrice === null) {
      summary.textContent =
        'روش ارسال: ' + (shippingMethod || 'انتخاب نشده') +
        ' | مبلغ نهایی پس از مشخص‌شدن قیمت کالا/هزینهٔ ارسال اعلام می‌شود.';
    } else {
      summary.textContent =
        'جمع کالا و ارسال، پیش از تخفیف: ' +
        formatMoney(productPrice + shippingPrice);
    }
  }

  [city, method, quantity].forEach(el =>
    el.addEventListener('input', updateSummary)
  );

  function englishDigits(value) {
    return value
      .replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 1776))
      .replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 1632));
  }

  ['phone', 'postalCode'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', () => {
      el.value = englishDigits(el.value);
    });
  });

  document.getElementById('orderForm')
    .addEventListener('submit', function (event) {
      if (!catalogLoaded) {
        event.preventDefault();
        alert('لطفاً تا بارگذاری فهرست محصولات صبر کنید.');
        return;
      }

      document.getElementById('submitButton').disabled = true;
      document.getElementById('submitButton').textContent =
        'در حال ثبت سفارش...';

      // ارسال معمولی POST؛ از fetch استفاده نمی‌کنیم.
    });
</script>
</body>
</html>
