<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاپ‌یار | ثبت سفارش کالا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/font-face.css" rel="stylesheet">
    <style>body { font-family: 'Vazirmatn FD', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 flex items-center justify-center">

    <div class="bg-white max-w-md w-full rounded-2xl shadow-xl p-6 border border-slate-200">
        <!-- لوگو و عنوان -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-amber-500 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-bold mb-3 shadow-md">
                🛒
            </div>
            <h1 class="text-xl font-black text-slate-800">فرم ثبت سفارش سریع</h1>
            <p class="text-xs text-slate-500 mt-1">مشخصات خودتون رو برای ارسال سفارش وارد کنید</p>
        </div>

        <!-- فرم دریافت سفارش -->
        <form id="orderForm" onsubmit="sendOrder(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">نام و نام خانوادگی:</label>
                <input type="text" id="name" required placeholder="مثلاً: علی نوری" 
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">شماره تماس (جهت هماهنگی):</label>
                <input type="tel" id="phone" required placeholder="0912xxxxxxx" dir="ltr"
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm text-right focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">نام محصول یا توضیحات سفارش:</label>
                <input type="text" id="product" required placeholder="مثلاً: هودی مشکی سایز L" 
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">آدرس کامل و کد پستی:</label>
                <textarea id="address" rows="3" required placeholder="شهر، خیابان، کوچه، پلاک، واحد..." 
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-amber-500/30 flex items-center justify-center">
                <span>تکمیل و ثبت سفارش</span>
            </button>
        </form>

        <!-- پیام موفقیت -->
        <div id="successMsg" class="hidden mt-4 p-4 bg-emerald-50 border border-emerald-300 rounded-xl text-center">
            <p class="text-emerald-700 font-bold text-sm">✅ سفارش شما با موفقیت ثبت شد!</p>
            <p class="text-xs text-emerald-600 mt-1">همکاران ما به زودی با شما تماس خواهند گرفت.</p>
        </div>
    </div>

    <script>
        const BOT_TOKEN = 'GAPGPTMASKTOKENeokjbxmpeukX0X';
        const CHAT_ID = '9187106319';

        async function sendOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = 'در حال ثبت...';

            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const product = document.getElementById('product').value;
            const address = document.getElementById('address').value;

            const text = `🛍 *سفارش جدید شاپ‌یار!*%0A%0A` +
                         `👤 *مشتری:* ${encodeURIComponent(name)}%0A` +
                         `📞 *تماس:* ${encodeURIComponent(phone)}%0A` +
                         `📦 *محصول:* ${encodeURIComponent(product)}%0A` +
                         `📍 *آدرس:* ${encodeURIComponent(address)}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${text}&parse_mode=Markdown`);
                if (response.ok) {
                    document.getElementById('orderForm').classList.add('hidden');
                    document.getElementById('successMsg').classList.remove('hidden');
                } else {
                    alert('خطا در ارسال! لطفا دوباره تلاش کنید.');
                    btn.disabled = false;
                    btn.innerHTML = 'تکمیل و ثبت سفارش';
                }
            } catch (err) {
                alert('خطا در شبکه. لطفا اتصال اینترنت خود را چک کنید.');
                btn.disabled = false;
                btn.innerHTML = 'تکمیل و ثبت سفارش';
            }
        }
    </script>
</body>
</html>
