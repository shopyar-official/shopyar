<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاپ‌یار | سفارش سریع کالا</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6 text-center">
        <h1 class="text-xl font-bold flex items-center justify-center gap-2">
            <i class="fa-solid fa-store"></i> فروشگاه آنلاین شاپ‌یار
        </h1>
        <p class="text-xs text-indigo-200 mt-1">ثبت سفارش سریع و آسان</p>
    </header>

    <!-- Main Form Container -->
    <main class="max-w-md mx-auto p-4 w-full flex-grow">
        <div class="bg-white rounded-2xl shadow-lg p-6 mt-4 border border-gray-100">
            <h2 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fa-solid fa-cart-shopping text-indigo-600"></i> فرم ثبت سفارش کالا
            </h2>

            <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">نام و نام خانوادگی</label>
                    <input type="text" id="fullName" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="مثلاً علی رضایی">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">شماره تماس (موبایل)</label>
                    <input type="tel" id="phone" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-left dir-ltr" placeholder="09123456789">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">مدل کالا / محصول درخواستی</label>
                    <input type="text" id="product" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="مثلاً کفش نایک سایز ۴۲">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">آدرس پستی کامل</label>
                    <textarea id="address" rows="3" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="استان، شهر، خیابان، پلاک، واحد"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md">
                    ثبت نهایی سفارش
                </button>
            </form>

            <div id="successMessage" class="hidden mt-4 p-4 bg-green-50 border border-green-200 text-green-700 rounded-xl text-center font-medium">
                <i class="fa-solid fa-circle-check text-xl mb-1 block"></i>
                سفارش شما با موفقیت ثبت شد! به زودی با شما تماس می‌گیریم.
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-gray-400">
        طراحی شده با سیستم شاپ‌یار
    </footer>

    <!-- Telegram Integration Script -->
    <script>
        const BOT_TOKEN = "7939103980:AAHWvQc3YFpU_B7M1jS3b08k9c8sZ6t2b5U"; // توکن ربات شما
        const CHAT_ID = "9187106319"; // چت‌آیدی عددی شما

        async function submitOrder(event) {
            event.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'در حال ارسال سفارش...';

            const fullName = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;
            const product = document.getElementById('product').value;
            const address = document.getElementById('address').value;

            const text = `🚨 *سفارش جدید ثبت شد!* 🛍️\n\n👤 *نام:* ${fullName}\n📞 *تلفن:* ${phone}\n📦 *کالا:* ${product}\n📍 *آدرس:* ${address}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'Markdown'
                    })
                });

                if (response.ok) {
                    document.getElementById('orderForm').classList.add('hidden');
                    document.getElementById('successMessage').classList.remove('hidden');
                } else {
                    alert('خطا در ارسال سفارش. لطفاً دوباره تلاش کنید.');
                    btn.disabled = false;
                    btn.textContent = 'ثبت نهایی سفارش';
                }
            } catch (error) {
                alert('خطا در اتصال به شبکه.');
                btn.disabled = false;
                btn.textContent = 'ثبت نهایی سفارش';
            }
        }
    </script>
</body>
</html>
