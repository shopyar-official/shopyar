<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت سفارش - شاپ‌یار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-sm border border-slate-100 p-6 md:p-8">
        
        <!-- هدر فرم -->
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-slate-800">🛍️ ثبت سفارش در شاپ‌یار</h1>
            <p class="text-xs text-slate-500 mt-1">لطفاً مشخصات خود را جهت ارسال سفارش وارد کنید</p>
        </div>

        <!-- فرم ثبت سفارش -->
        <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
            
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">نام و نام خانوادگی *</label>
                <input type="text" id="name" required class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">شماره موبایل *</label>
                <input type="tel" id="phone" required class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium" placeholder="09123456789">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">شهر *</label>
                <input type="text" id="city" required class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">آدرس پستی کامل *</label>
                <textarea id="address" required rows="2" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium"></textarea>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">انتخاب محصول *</label>
                <select id="productSelect" onchange="updateTotal()" required class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium text-slate-700">
                    <option value="" disabled selected>در حال بارگذاری محصولات...</option>
                </select>
            </div>

            <!-- انتخاب تعداد -->
            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">تعداد *</label>
                <input type="number" id="quantity" min="1" value="1" onchange="updateTotal()" oninput="updateTotal()" required class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium text-slate-700">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">نوع ارسال *</label>
                <select id="shippingSelect" onchange="updateTotal()" required class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium text-slate-700">
                    <option value="" disabled selected>انتخاب نوع ارسال...</option>
                    <option value="50000" data-name="پست پیشتاز">پست پیشتاز (۵۰,۰۰۰ تومان)</option>
                    <option value="80000" data-name="تیپاکس">تیپاکس (۸۰,۰۰۰ تومان)</option>
                    <option value="30000" data-name="پیک موتوری">پیک موتوری (۳۰,۰۰۰ تومان)</option>
                </select>
            </div>

            <!-- اطلاعات پرداخت و فیش -->
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3">
                <div class="text-xs font-bold text-slate-800">💳 اطلاعات پرداخت (الزامی)</div>
                <p class="text-[11px] text-slate-500">لطفاً تصویر فیش واریزی یا شماره پیگیری تراکنش خود را ثبت کنید:</p>

                <div>
                    <label class="block text-[11px] font-medium text-slate-600 mb-1">بارگذاری تصویر فیش (حداکثر ۲ مگابایت):</label>
                    <input type="file" id="receiptFile" accept="image/jpeg,image/png,image/webp,application/pdf" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-medium file:bg-orange-500 file:text-white hover:file:bg-orange-600 cursor-pointer">
                </div>

                <div class="text-center text-[10px] text-slate-400 font-bold">یا</div>

                <div>
                    <label class="block text-[11px] font-medium text-slate-600 mb-1">کد پیگیری / شماره ارجاع واریز:</label>
                    <input type="text" id="paymentCode" placeholder="مثال: 7654321" class="w-full text-xs bg-white border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium">
                </div>
            </div>

            <!-- جمع فاکتور -->
            <div class="bg-orange-50 border border-orange-200 rounded-2xl p-4 text-slate-700 space-y-1 text-xs">
                <div class="flex justify-between">
                    <span>قیمت کل محصولات:</span>
                    <span id="productPriceText">۰ تومان</span>
                </div>
                <div class="flex justify-between">
                    <span>هزینه ارسال:</span>
                    <span id="shippingPriceText">۰ تومان</span>
                </div>
                <div class="border-t border-orange-200 pt-2 flex justify-between font-bold text-sm text-orange-800">
                    <span>مبلغ کل قابل پرداخت:</span>
                    <span id="totalPriceText">۰ تومان</span>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-xl text-xs transition shadow-sm">
                ثبت نهایی سفارش
            </button>
        </form>

        <div id="responseMessage" class="mt-4 text-center text-xs"></div>

        <!-- بخش پیگیری سفارش مشتری -->
        <div class="mt-8 pt-6 border-t border-slate-100">
            <h3 class="text-xs font-bold text-slate-800 mb-2 flex items-center gap-1">🔍 پیگیری وضعیت سفارش با کد رهگیری</h3>
            <div class="flex gap-2">
                <input type="text" id="trackOrderId" placeholder="مثلا SHP-17100" class="flex-1 text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium">
                <button onclick="trackOrder()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium px-3 py-2 rounded-xl transition">پیگیری</button>
            </div>
            <div id="trackResult" class="mt-3 text-xs"></div>
        </div>

    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec';
        let productsData = [];

        window.addEventListener('DOMContentLoaded', () => {
            fetchProducts();
        });

        function fetchProducts() {
            fetch(`${SCRIPT_URL}?action=get_products`)
                .then(res => res.json())
                .then(data => {
                    const select = document.getElementById('productSelect');
                    select.innerHTML = '<option value="" disabled selected>انتخاب محصول...</option>';
                    if(Array.isArray(data) && data.length > 0) {
                        productsData = data;
                        data.forEach((p, index) => {
                            const opt = document.createElement('option');
                            opt.value = index;
                            opt.textContent = `${p.name} - ${Number(p.price || 0).toLocaleString()} تومان`;
                            select.appendChild(opt);
                        });
                    } else {
                        select.innerHTML = '<option value="" disabled>محصولی یافت نشد</option>';
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('productSelect').innerHTML = '<option value="" disabled>خطا در بارگذاری محصولات</option>';
                });
        }

        function updateTotal() {
            const productIndex = document.getElementById('productSelect').value;
            const quantity = Number(document.getElementById('quantity').value) || 1;
            const shippingVal = Number(document.getElementById('shippingSelect').value) || 0;
            
            let unitPrice = 0;
            if(productIndex !== "" && productsData[productIndex]) {
                unitPrice = Number(productsData[productIndex].price || 0);
            }

            const productTotalPrice = unitPrice * quantity;
            const total = productTotalPrice + shippingVal;

            document.getElementById('productPriceText').textContent = productTotalPrice.toLocaleString() + ' تومان';
            document.getElementById('shippingPriceText').textContent = shippingVal.toLocaleString() + ' تومان';
            document.getElementById('totalPriceText').textContent = total.toLocaleString() + ' تومان';
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const result = String(reader.result || '');
                    const commaIdx = result.indexOf(',');
                    if (commaIdx !== -1) {
                        resolve(result.slice(commaIdx + 1));
                    } else {
                        resolve('');
                    }
                };
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        async function submitOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const resp = document.getElementById('responseMessage');
            
            const productIndex = document.getElementById('productSelect').value;
            if (productIndex === "" || !productsData[productIndex]) {
                alert('لطفاً محصول مورد نظر را انتخاب کنید.');
                return;
            }

            const shippingSelect = document.getElementById('shippingSelect');
            if (!shippingSelect.value) {
                alert('لطفاً نوع ارسال را انتخاب کنید.');
                return;
            }

            const paymentCode = document.getElementById('paymentCode').value.trim();
            const receiptFileInput = document.getElementById('receiptFile');
            const file = receiptFileInput.files[0];

            if (!paymentCode && !file) {
                alert('ثبت حداقل یکی از موارد «فیش واریزی» یا «کد پیگیری پرداخت» الزامی است.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'در حال ثبت و ارسال سفارش...';
            resp.innerHTML = '';

            try {
                let receiptBase64 = '';
                let receiptMime = '';

                if (file) {
                    if (file.size > 2 * 1024 * 1024) {
                        alert('حجم فایل فیش باید کمتر از ۲ مگابایت باشد.');
                        btn.disabled = false;
                        btn.textContent = 'ثبت نهایی سفارش';
                        return;
                    }
                    receiptBase64 = await readFileAsBase64(file);
                    receiptMime = file.type || 'image/jpeg';
                }

                const selectedProductName = productsData[productIndex].name;
                const unitPrice = Number(productsData[productIndex].price || 0);
                const quantity = Number(document.getElementById('quantity').value) || 1;
                const shippingCost = shippingSelect.value;
                const selectedShippingOption = shippingSelect.options[shippingSelect.selectedIndex];
                const shippingMethodName = selectedShippingOption.getAttribute('data-name') || selectedShippingOption.text;
                const totalAmount = (unitPrice * quantity) + Number(shippingCost);

                const formData = new URLSearchParams({
                    action: 'add_order',
                    name: document.getElementById('name').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    city: document.getElementById('city').value.trim(),
                    address: document.getElementById('address').value.trim(),
                    product: selectedProductName,
                    quantity: String(quantity),
                    shipping: String(shippingCost),
                    shipping_name: shippingMethodName,
                    unitPrice: String(unitPrice),
                    discountCode: '',
                    discountAmount: '0',
                    totalAmount: String(totalAmount),
                    paymentCode: paymentCode,
                    receiptBase64: receiptBase64,
                    receiptMime: receiptMime
                });

                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.status === 'success') {
                    resp.innerHTML = `<span class="text-emerald-600 font-bold">سفارش شما با موفقیت ثبت شد!<br>کد پیگیری: ${data.orderId}</span>`;
                    document.getElementById('orderForm').reset();
                    document.getElementById('quantity').value = '1';
                    document.getElementById('productPriceText').textContent = '۰ تومان';
                    document.getElementById('shippingPriceText').textContent = '۰ تومان';
                    document.getElementById('totalPriceText').textContent = '۰ تومان';
                } else {
                    resp.innerHTML = `<span class="text-rose-500">${data.message || 'خطا در ثبت سفارش. لطفاً دوباره تلاش کنید.'}</span>`;
                }
            } catch (err) {
                console.error(err);
                resp.innerHTML = '<span class="text-rose-500">خطا در ارسال اطلاعات یا اتصال به سرور.</span>';
            } finally {
                btn.disabled = false;
                btn.textContent = 'ثبت نهایی سفارش';
            }
        }

        function trackOrder() {
            const orderId = document.getElementById('trackOrderId').value.trim();
            const resultDiv = document.getElementById('trackResult');
            
            if (!orderId) {
                resultDiv.innerHTML = '<span class="text-rose-500">لطفاً کد سفارش را وارد کنید.</span>';
                return;
            }

            resultDiv.innerHTML = '<span class="text-slate-400">در حال جستجو...</span>';

            fetch(`${SCRIPT_URL}?action=get_orders`)
                .then(res => res.json())
                .then(data => {
                    if (Array.isArray(data)) {
                        const order = data.find(o => String(o.orderId || '').toLowerCase() === orderId.toLowerCase());
                        if (order) {
                            resultDiv.innerHTML = `
                                <div class="bg-orange-50 border border-orange-200 rounded-xl p-3 text-slate-700 space-y-1">
                                    <div><strong>نام:</strong> ${order.name}</div>
                                    <div><strong>محصول:</strong> ${order.product} (تعداد: ${order.quantity || 1})</div>
                                    <div><strong>وضعیت:</strong> <span class="text-orange-600 font-bold">${order.status || 'منتظر تأیید'}</span></div>
                                    <div><strong>تاریخ ثبت:</strong> ${order.date}</div>
                                </div>
                            `;
                        } else {
                            resultDiv.innerHTML = '<span class="text-rose-500">سفارشی با این کد پیدا نشد!</span>';
                        }
                    } else {
                        resultDiv.innerHTML = '<span class="text-rose-500">خطا در دریافت اطلاعات.</span>';
                    }
                })
                .catch(err => {
                    resultDiv.innerHTML = '<span class="text-rose-500">خطا در اتصال به سرور.</span>';
                });
        }
    </script>
</body>
</html>
