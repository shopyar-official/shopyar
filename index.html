<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>شاپ‌یار | ثبت سفارش</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      color: #1e293b;
      font-family: Tahoma, sans-serif;
    }
    main {
      width: 100%;
      max-width: 460px;
      padding: 28px 24px;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 16px 40px rgba(15, 23, 42, .08);
    }
    .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #f59e0b;
      font-size: 28px;
    }
    h1 { margin: 0; text-align: center; font-size: 22px; }
    .subtitle {
      margin: 9px 0 22px;
      color: #64748b;
      text-align: center;
      font-size: 13px;
      line-height: 1.9;
    }
    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 13px;
      font-weight: bold;
    }
    input, textarea {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 11px;
      background: #f8fafc;
      font: inherit;
      font-size: 14px;
      outline: none;
    }
    input:focus, textarea:focus { border-color: #f59e0b; }
    textarea { min-height: 82px; resize: vertical; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #f59e0b;
      color: #172033;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    .hint {
      margin: 14px 0 0;
      color: #64748b;
      text-align: center;
      font-size: 11px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">🛍️</div>
    <h1>ثبت سفارش سریع</h1>
    <p class="subtitle">مشخصاتتان را وارد کنید تا سفارشتان ثبت شود.</p>

    <form
      id="orderForm"
      action="https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec"
      method="post"
      target="_self">

      <label for="name">نام و نام خانوادگی</label>
      <input id="name" name="name" type="text" required maxlength="100"
        autocomplete="name" placeholder="مثلاً علی نوری">

      <label for="phone">شماره تماس</label>
      <input id="phone" name="phone" type="tel" required maxlength="20"
        autocomplete="tel" placeholder="مثلاً 09123456789" dir="ltr">

      <label for="city">شهر</label>
      <input id="city" name="city" type="text" required maxlength="100"
        placeholder="مثلاً تهران">

      <label for="address">آدرس کامل</label>
      <textarea id="address" name="address" required maxlength="500"
        placeholder="خیابان، کوچه، پلاک، واحد..."></textarea>

      <label for="product">محصول یا توضیحات سفارش</label>
      <input id="product" name="product" type="text" required maxlength="200"
        placeholder="مثلاً هودی مشکی سایز L">

      <button id="submitBtn" type="submit">ثبت سفارش</button>
      <p class="hint">بعد از ثبت موفق، سفارش در گوگل‌شیت ذخیره می‌شود.</p>
    </form>
  </main>

  <script>
    const form = document.getElementById('orderForm');
    const button = document.getElementById('submitBtn');

    window.addEventListener('pageshow', function () {
      form.reset();
      button.disabled = false;
      button.textContent = 'ثبت سفارش';
    });

    form.addEventListener('submit', function () {
      button.disabled = true;
      button.textContent = 'در حال ارسال...';
    });
  </script>
</body>
</html>
