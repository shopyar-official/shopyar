<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاپ‌یار | ثبت سفارش آنلاین</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 py-6 px-4">

    <div class="max-w-md mx-auto bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
        <!-- هدر -->
        <div class="bg-indigo-600 px-6 py-5 text-white text-center">
            <h1 class="font-bold text-lg">فروشگاه من (شاپ‌یار)</h1>
            <p class="text-xs text-indigo-100 mt-1">فرم ثبت سفارش سریع</p>
        </div>

        <!-- فرم -->
        <form id="order-form" class="p-6 space-y-4">
            
            <!-- انتخاب محصول -->
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">انتخاب محصول:</label>
                <select id="product" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-600 transition">
                    <option value="">-- لطفاً محصولی انتخاب کنید --</option>
                </select>
            </div>

            <!-- تعداد -->
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">تعداد:</label>
                <input type="number" id="quantity" min="1" value="1" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-600 transition">
            </div>

            <!-- نام و نام خانوادگی -->
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">نام و نام خانوادگی گیرنده:</label>
                <input type="text" id="name" placeholder="مثلاً علی رضایی" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-600 transition">
            </div>

            <!-- شماره موبایل -->
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">شماره موبایل:</label>
                <input type="tel" id="phone" placeholder="09123456789" required dir="ltr" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm text-right focus:outline-none focus:border-indigo-600 transition">
            </div>

            <!-- شهر -->
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">شهر:</label>
                <input type="text" id="city" placeholder="مثلاً تهران" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-600 transition">
            </div>

            <!-- روش ارسال -->
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">روش ارسال:</label>
                <select id="shipping-method" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-600 transition">
                    <option value="پیشتاز|35000">پست پیشتاز (۳۵,۰۰۰ تومان)</option>
                    <option value="تیپاکس|50000">تیپاکس - پس کرایه (۵۰,۰۰۰ تومان)</option>
                    <option value="پیک|40000">پیک موتوری (۴۰,۰۰۰ تومان)</option>
                </select>
            </div>

            <!-- آدرس پستی کامل -->
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">آدرس پستی کامل:</label>
                <textarea id="address" rows="3" placeholder="خیابان، پلاک، واحد..." required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-600 transition"></textarea>
            </div>

            <!-- دکمه ثبت -->
            <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-100 transition">
                تایید و ثبت نهایی سفارش
            </button>
        </form>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec';

        // بارگذاری محصولات از گوگل‌شیت
        async function loadProducts() {
            try {
                const res = await fetch(SCRIPT_URL + '?action=get_products');
                const data = await res.json();
                const select = document.getElementById('product');
                
                if (data.status === 'success' && data.products) {
                    data.products.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.name;
                        opt.textContent = `${p.name} - ${Number(p.price).toLocaleString()} تومان`;
                        opt.dataset.price = p.price;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error("خطا در بارگذاری محصولات", err);
            }
        }

        loadProducts();

        // ثبت سفارش
        document.getElementById('order-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'در حال ثبت سفارش...';

            const shippingData = document.getElementById('shipping-method').value.split('|');
            const shippingMethod = shippingData[0];
            const shippingCost = shippingData[1];

            const formData = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                city: document.getElementById('city').value,
                address: document.getElementById('address').value,
                product: document.getElementById('product').value,
                quantity: document.getElementById('quantity').value,
                shippingMethod: shippingMethod,
                shippingCost: shippingCost
            };

            try {
                // ارسال به گوگل‌شیت (از طریق اکشن ثبت)
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(formData)
                });
                
                alert('سفارش شما با موفقیت ثبت شد!');
                document.getElementById('order-form').reset();
            } catch (err) {
                alert('خطا در ثبت سفارش. لطفاً دوباره تلاش کنید.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'تایید و ثبت نهایی سفارش';
            }
        });
    </script>
</body>
</html>
