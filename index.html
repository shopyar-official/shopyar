<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت سفارش سریع - شاپ‌یار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-6 md:p-8 border border-slate-100">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">🛍️ شاپ‌یار</h1>
            <p class="text-sm text-slate-500 mt-1">لطفاً اطلاعات سفارش خود را وارد کنید</p>
        </div>

        <form id="orderForm" class="space-y-4">
            <!-- نام مشتری -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">نام و نام خانوادگی</label>
                <input type="text" id="name" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:outline-none text-sm bg-slate-50">
            </div>

            <!-- شماره تلفن -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">شماره تماس</label>
                <input type="tel" id="phone" required placeholder="09123456789" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:outline-none text-sm bg-slate-50 text-left" dir="ltr">
            </div>

            <!-- شهر -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">شهر</label>
                <input type="text" id="city" required placeholder="مثلا: تهران" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:outline-none text-sm bg-slate-50">
            </div>

            <!-- آدرس پستی -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">آدرس کامل پستی</label>
                <textarea id="address" rows="2" required placeholder="استان، شهر، خیابان، پلاک، واحد" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:outline-none text-sm bg-slate-50"></textarea>
            </div>

            <!-- انتخاب محصول -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">انتخاب محصول</label>
                <select id="product" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:outline-none text-sm bg-slate-50" onchange="calculateTotal()">
                    <option value="">در حال بارگذاری محصولات...</option>
                </select>
            </div>

            <!-- نوع ارسال -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">نوع ارسال</label>
                <select id="shipping" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:outline-none text-sm bg-slate-50" onchange="calculateTotal()">
                    <option value="پیشتاز|40000">پست پیشتاز (۴۰,۰۰۰ تومان)</option>
                    <option value="تیپاکس|60000">تیپاکس (پس کرایه / ۶۰,۰۰۰ تومان)</option>
                    <option value="پیک|50000">پیک موتوری (ویژه تهران - ۵۰,۰۰۰ تومان)</option>
                </select>
            </div>

            <!-- کادر نمایش جمع کل فاکتور -->
            <div class="bg-orange-50 border border-orange-100 rounded-xl p-4 flex items-center justify-between">
                <span class="text-sm font-medium text-slate-700">مجموع قابل پرداخت:</span>
                <span id="totalPrice" class="text-base font-bold text-orange-600">۰ تومان</span>
            </div>

            <!-- دکمه ثبت -->
            <button type="submit" id="submitBtn" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-orange-600/20 text-sm">
                ثبت نهایی سفارش
            </button>
        </form>

        <div id="resultMessage" class="hidden mt-4 p-3 rounded-xl text-center text-sm font-medium"></div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec';
        let productsData = [];

        // بارگذاری محصولات از گوگل شیت
        window.addEventListener('DOMContentLoaded', () => {
            fetch(`${SCRIPT_URL}?action=get_products`)
                .then(res => res.json())
                .then(data => {
                    const productSelect = document.getElementById('product');
                    productSelect.innerHTML = '<option value="">انتخاب محصول...</option>';
                    if(data && data.length > 0) {
                        productsData = data;
                        data.forEach((item, index) => {
                            let opt = document.createElement('option');
                            opt.value = index; // ذخیره ایندکس محصول برای دسترسی به قیمت
                            opt.textContent = `${item.name} (${Number(item.price || 0).toLocaleString()} تومان)`;
                            productSelect.appendChild(opt);
                        });
                    }
                    calculateTotal();
                })
                .catch(err => {
                    console.error('خطا در دریافت محصولات:', err);
                    document.getElementById('product').innerHTML = '<option value="">خطا در بارگذاری محصولات</option>';
                });
        });

        // محاسبه خودکار جمع کل فاکتور
        function calculateTotal() {
            const productIndex = document.getElementById('product').value;
            const shippingVal = document.getElementById('shipping').value;

            let productPrice = 0;
            if (productIndex !== "" && productsData[productIndex]) {
                productPrice = Number(productsData[productIndex].price || 0);
            }

            let shippingPrice = 0;
            if (shippingVal) {
                shippingPrice = Number(shippingVal.split('|')[1]);
            }

            let total = productPrice + shippingPrice;
            document.getElementById('totalPrice').textContent = total > 0 ? total.toLocaleString() + ' تومان' : '۰ تومان';
        }

        // ارسال فرم سفارش به گوگل شیت
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('resultMessage');
            
            btn.disabled = true;
            btn.textContent = 'در حال ثبت سفارش...';
            msgBox.className = 'hidden mt-4 p-3 rounded-xl text-center text-sm font-medium';

            const productIndex = document.getElementById('product').value;
            const selectedProduct = productsData[productIndex];
            const shippingOpt = document.getElementById('shipping').value.split('|');
            
            const productName = selectedProduct ? selectedProduct.name : '';
            const productPrice = selectedProduct ? Number(selectedProduct.price || 0) : 0;
            const shippingName = shippingOpt[0];
            const shippingPrice = Number(shippingOpt[1]);
            const totalAmount = productPrice + shippingPrice;

            // ساخت رشته توضیحات محصول و ارسال شامل هزینه ارسال و جمع کل
            const fullProductDescription = `${productName} (${productPrice.toLocaleString()} ت) + ارسال ${shippingName} (${shippingPrice.toLocaleString()} ت) | جمع کل: ${totalAmount.toLocaleString()} تومان`;

            const formData = new URLSearchParams({
                name: document.getElementById('name').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                city: document.getElementById('city').value.trim(),
                address: document.getElementById('address').value.trim(),
                product: fullProductDescription
            });

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    msgBox.textContent = `✅ سفارش شما با موفقیت ثبت شد! کد پیگیری: ${data.orderId}`;
                    msgBox.className = 'mt-4 p-3 rounded-xl text-center text-sm font-medium bg-emerald-50 text-emerald-700 border border-emerald-100';
                    document.getElementById('orderForm').reset();
                    calculateTotal();
                } else {
                    throw new Error(data.message || 'خطای ناشناخته');
                }
            })
            .catch(err => {
                msgBox.textContent = '❌ خطا در ثبت سفارش. لطفاً دوباره تلاش کنید.';
                msgBox.className = 'mt-4 p-3 rounded-xl text-center text-sm font-medium bg-rose-50 text-rose-700 border border-rose-100';
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = 'ثبت نهایی سفارش';
            });
        });
    </script>
</body>
</html>
