<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>شاپ‌یار | ثبت سفارش</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f6fb;
      color: #1e293b;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #fff0e5;
      font-size: 32px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .subtitle {
      margin: 0;
      color: #64748b;
      font-size: 14px;
      line-height: 1.8;
    }

    .card {
      padding: 24px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07);
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      display: block;
      width: 100%;
      min-height: 46px;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 11px;
      background: #fff;
      color: #1e293b;
      font: inherit;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #ea580c;
      box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.12);
    }

    input::placeholder,
    textarea::placeholder {
      color: #94a3b8;
    }

    .hint {
      display: block;
      margin-top: 7px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.7;
    }

    .selected-shipping {
      margin: 9px 0 0;
      color: #475569;
      font-size: 13px;
    }

    .selected-shipping strong {
      color: #c2410c;
    }

    button {
      display: block;
      width: 100%;
      min-height: 49px;
      margin-top: 23px;
      border: 0;
      border-radius: 11px;
      background: #ea580c;
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #c2410c;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
    }

    @media (max-width: 420px) {
      .card {
        padding: 19px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="logo" aria-hidden="true">🛍️</div>
      <h1>ثبت سفارش در شاپ‌یار</h1>
      <p class="subtitle">اطلاعات زیر را تکمیل کنید تا سفارش شما ثبت شود.</p>
    </header>

    <div class="card">
      <form
        id="orderForm"
        action="https://script.google.com/macros/s/AKfycbwLgeiCNbswEwfO2tAdnsV_lKdlecPBdHchqFQj0B_Mv6k6P7YlqdTvZ0VQF3Gy7E5e/exec"
        method="POST"
        accept-charset="UTF-8"
      >
        <div class="field">
          <label for="name">نام و نام خانوادگی</label>
          <input
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            placeholder="نام خود را وارد کنید"
            required
          >
        </div>

        <div class="field">
          <label for="phone">شماره موبایل</label>
          <input
            id="phone"
            name="phone"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            maxlength="11"
            pattern="09[0-9]{9}"
            title="شماره موبایل را به صورت ۱۱ رقم و با ۰۹ وارد کنید"
            placeholder="مثلاً 09123456789"
            required
          >
        </div>

        <div class="field">
          <label for="city">شهر</label>
          <input
            id="city"
            name="city"
            type="text"
            autocomplete="address-level2"
            placeholder="شهر مقصد"
            required
          >
        </div>

        <div class="field">
          <label for="address">آدرس کامل</label>
          <textarea
            id="address"
            name="address"
            autocomplete="street-address"
            placeholder="محله، خیابان، پلاک و واحد"
            required
          ></textarea>
        </div>

        <div class="field">
          <label for="product">محصول موردنظر</label>
          <input
            id="product"
            name="product"
            type="text"
            placeholder="نام محصول یا توضیح سفارش"
            required
          >
        </div>

        <div class="field">
          <label for="postalCode">کد پستی</label>
          <input
            id="postalCode"
            name="postalCode"
            type="text"
            inputmode="numeric"
            autocomplete="postal-code"
            maxlength="10"
            pattern="[0-9]{10}"
            title="کد پستی باید دقیقاً ۱۰ رقم باشد"
            placeholder="کد پستی ۱۰ رقمی"
            required
          >
          <small class="hint">ارقام فارسی و انگلیسی هر دو قابل وارد کردن‌اند.</small>
        </div>

        <div class="field">
          <label for="shippingMethod">روش ارسال</label>
          <select id="shippingMethod" name="shippingMethod" required>
            <option value="" selected disabled>روش ارسال را انتخاب کنید</option>
            <option value="پست پیشتاز">پست پیشتاز</option>
            <option value="تیپاکس">تیپاکس</option>
            <option value="پست سفارشی">پست سفارشی</option>
            <option value="پیک شهری">پیک شهری</option>
            <option value="تحویل حضوری">تحویل حضوری</option>
          </select>
          <p class="selected-shipping" aria-live="polite">
            روش ارسال انتخاب‌شده: <strong id="shippingPreview">هنوز انتخاب نشده</strong>
          </p>
        </div>

        <button id="submitButton" type="submit">ثبت سفارش</button>
      </form>
    </div>

    <p class="footer">شاپ‌یار | ثبت سریع و آسان سفارش</p>
  </main>

  <script>
    const shippingSelect = document.getElementById('shippingMethod');
    const shippingPreview = document.getElementById('shippingPreview');

    shippingSelect.addEventListener('change', function () {
      shippingPreview.textContent =
        shippingSelect.value || 'هنوز انتخاب نشده';
    });

    function toEnglishDigits(value) {
      return value
        .replace(/[۰-۹]/g, digit => String(digit.charCodeAt(0) - 1776))
        .replace(/[٠-٩]/g, digit => String(digit.charCodeAt(0) - 1632));
    }

    const phoneInput = document.getElementById('phone');
    const postalInput = document.getElementById('postalCode');

    [phoneInput, postalInput].forEach(function (input) {
      input.addEventListener('input', function () {
        input.value = toEnglishDigits(input.value);
      });
    });

    document.getElementById('orderForm').addEventListener('submit', function () {
      phoneInput.value = toEnglishDigits(phoneInput.value);
      postalInput.value = toEnglishDigits(postalInput.value);

      const button = document.getElementById('submitButton');
      button.disabled = true;
      button.textContent = 'در حال ثبت سفارش...';

      // عمداً preventDefault نداریم:
      // فرم باید با POST به doPost گوگل‌اسکریپت ارسال شود.
    });
  </script>
</body>
</html>
